services:
  mysql:
    image: mysql:8.4
    container_name: lumira-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local-dev-mysql-password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-saas}
      MYSQL_INITDB_SKIP_TZINFO: '1'
    ports:
    - 3306:3306
    volumes:
    - mysql_data:/var/lib/mysql
    - ../lumira-backend/sql/saas.sql:/docker-entrypoint-initdb.d/001-saas.sql:ro
    healthcheck:
      test:
      - CMD-SHELL
      - mysqladmin ping -h 127.0.0.1 -uroot -p"$${MYSQL_ROOT_PASSWORD}" --silent
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
  redis:
    image: redis:7.4
    container_name: lumira-redis
    restart: unless-stopped
    command:
    - redis-server
    - --appendonly
    - 'yes'
    ports:
    - 6379:6379
    volumes:
    - redis_data:/data
  xxl-job-admin:
    build:
      context: ..
      dockerfile: deploy/docker/xxl-job-admin.Dockerfile
      args:
        MAVEN_IMAGE: ${MAVEN_IMAGE:-maven:3.9.11-eclipse-temurin-21}
        JRE_IMAGE: ${JRE_IMAGE:-eclipse-temurin:21-jre}
        XXL_JOB_VERSION: ${XXL_JOB_VERSION:-3.4.0}
    image: ${XXL_JOB_ADMIN_IMAGE:-lumira/xxl-job-admin:3.4.0}
    container_name: lumira-xxl-job-admin
    restart: unless-stopped
    extra_hosts:
    - host.docker.internal:host-gateway
    environment:
      PARAMS: --server.port=8080 --spring.datasource.url=jdbc:mysql://${XXL_JOB_DB_HOST:-mysql}:3306/saas?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC
        --spring.datasource.username=root --spring.datasource.password=${MYSQL_ROOT_PASSWORD:-local-dev-mysql-password}
        --xxl.job.accessToken=${XXL_JOB_ADMIN_ACCESS_TOKEN:-lumira-xxl-job-token}
        --xxl.job.login.username=admin --xxl.job.login.password=${XXL_JOB_LOGIN_PASSWORD:-local-dev-xxl-password}
    ports:
    - 8090:8080
    healthcheck:
      test:
      - CMD-SHELL
      - curl -fsS http://127.0.0.1:8080/xxl-job-admin/ >/dev/null
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    depends_on:
      mysql:
        condition: service_healthy
volumes:
  mysql_data: null
  redis_data: null
