services:
  mysql:
    image: mysql:8.4
    container_name: lumira-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local-dev-mysql-password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-saas}
      MYSQL_INITDB_SKIP_TZINFO: '1'
    ports:
    - 3306:3306
    volumes:
    - mysql_data:/var/lib/mysql
  redis:
    image: redis:7.4
    container_name: lumira-redis
    restart: unless-stopped
    command:
    - redis-server
    - --appendonly
    - 'yes'
    ports:
    - 6379:6379
    volumes:
    - redis_data:/data
  xxl-job-admin:
    image: xuxueli/xxl-job-admin:3.4.0
    container_name: lumira-xxl-job-admin
    restart: unless-stopped
    extra_hosts:
    - host.docker.internal:host-gateway
    environment:
      PARAMS: --server.port=8080 --spring.datasource.url=jdbc:mysql://${XXL_JOB_DB_HOST:-mysql}:3306/saas?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC
        --spring.datasource.username=root --spring.datasource.password=${MYSQL_ROOT_PASSWORD:-local-dev-mysql-password}
        --xxl.job.accessToken=${XXL_JOB_ADMIN_ACCESS_TOKEN:-lumira-xxl-job-token}
        --xxl.job.login.username=admin --xxl.job.login.password=${XXL_JOB_LOGIN_PASSWORD:-local-dev-xxl-password}
    ports:
    - 8090:8080
    depends_on:
    - mysql
volumes:
  mysql_data: null
  redis_data: null
