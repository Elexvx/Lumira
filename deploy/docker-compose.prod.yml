  plugin_staging: null
  certificate_data: null
  prometheus_data: null
  loki_data: null
  tempo_data: null
  grafana_data: null
networks:
  1panel-network:
    external: true
secrets:
  mysql_exporter_password:
    file: ${MYSQLD_EXPORTER_PASSWORD_FILE:-./.generated/secrets/mysql-exporter-password}
  # Managed MySQL must supply a [client] my.cnf with a host matching the certificate SAN,
  # ssl-ca=/run/secrets/mysql_exporter_ca and tls=custom. Certificate verification is mandatory.
  # mysqld_exporter v0.19 has no explicit server-name or TLS-version configuration keys.
  # Local MySQL reuses the password file here; the entrypoint ignores it unless it contains [client].
  mysql_exporter_config:
    file: ${MYSQLD_EXPORTER_CONFIG_FILE:-${MYSQLD_EXPORTER_PASSWORD_FILE:-./.generated/secrets/mysql-exporter-password}}
  mysql_exporter_ca:
    file: ${MYSQLD_EXPORTER_CA_FILE:-${MYSQLD_EXPORTER_PASSWORD_FILE:-./.generated/secrets/mysql-exporter-password}}
