x-service-build:
  context: ..
  dockerfile: deploy/docker/service.Dockerfile
x-json-logging: &id001
  driver: json-file
  options:
    max-size: ${DOCKER_LOG_MAX_SIZE:-100m}
    max-file: ${DOCKER_LOG_MAX_FILE:-3}
services:
  mysql:
    profiles:
    - local-mysql
    image: ${MYSQL_IMAGE:-docker.m.daocloud.io/library/mysql:8.4}
    container_name: lumira-mysql
    restart: unless-stopped
    logging: *id001
    mem_limit: ${MYSQL_MEM_LIMIT:-768m}
    cpus: ${MYSQL_CPUS:-1.0}
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-saas}
      MYSQL_INITDB_SKIP_TZINFO: '1'
      TZ: Asia/Shanghai
      DATABASE_VERSION: ${DATABASE_VERSION:-unknown}
    command:
    - --character-set-server=utf8mb4
    - --collation-server=utf8mb4_unicode_ci
    - --server-id=${MYSQL_SERVER_ID:-1}
    - --log-bin=${MYSQL_LOG_BIN_BASENAME:-mysql-bin}
    - --binlog-format=${MYSQL_BINLOG_FORMAT:-ROW}
    - --gtid-mode=${MYSQL_GTID_MODE:-ON}
    - --enforce-gtid-consistency=${MYSQL_ENFORCE_GTID_CONSISTENCY:-ON}
    - --binlog-expire-logs-seconds=${MYSQL_BINLOG_EXPIRE_LOGS_SECONDS:-1209600}
    - --sync-binlog=${MYSQL_SYNC_BINLOG:-1}
    - --innodb-flush-log-at-trx-commit=${MYSQL_INNODB_FLUSH_LOG_AT_TRX_COMMIT:-1}
    - --performance-schema=${MYSQL_PERFORMANCE_SCHEMA:-ON}
    volumes:
    - mysql_data:/var/lib/mysql
    - ../lumira-backend/sql/saas.sql:/docker-entrypoint-initdb.d/001-saas.sql:ro
    - ./.generated/database-version/002-database-version.sql:/docker-entrypoint-initdb.d/002-database-version.sql:ro
    networks:
    - default
    - 1panel-network
    healthcheck:
      test:
      - CMD-SHELL
      - mysqladmin ping -h 127.0.0.1 -uroot -p"$${MYSQL_ROOT_PASSWORD}" --silent
      interval: ${MYSQL_HEALTH_INTERVAL:-10s}
      timeout: ${MYSQL_HEALTH_TIMEOUT:-5s}
      retries: ${MYSQL_HEALTH_RETRIES:-30}
      start_period: ${MYSQL_HEALTH_START_PERIOD:-30s}
  redis:
    image: ${REDIS_IMAGE:-docker.m.daocloud.io/library/redis:7.4}
    container_name: lumira-redis
    restart: unless-stopped
    logging: *id001
    mem_limit: ${REDIS_MEM_LIMIT:-384m}
    cpus: ${REDIS_CPUS:-0.5}
    command: 'sh -c ''if [ -n "$$REDIS_PASSWORD" ]; then redis-server --appendonly
      yes --maxmemory "$${REDIS_MAXMEMORY:-256mb}" --maxmemory-policy allkeys-lru
      --requirepass "$$REDIS_PASSWORD"; else redis-server --appendonly yes --maxmemory
      "$${REDIS_MAXMEMORY:-256mb}" --maxmemory-policy allkeys-lru; fi''

      '
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      REDIS_MAXMEMORY: ${REDIS_MAXMEMORY:-256mb}
      TZ: Asia/Shanghai
    volumes:
    - redis_data:/data
  xxl-job-admin:
    build:
      context: ..
      dockerfile: deploy/docker/xxl-job-admin.Dockerfile
      args:
        MAVEN_IMAGE: ${MAVEN_IMAGE:-docker.m.daocloud.io/library/maven:3.9.11-eclipse-temurin-21}
        MAVEN_MIRROR_URL: ${MAVEN_MIRROR_URL:-https://mirrors.cloud.tencent.com/nexus/repository/maven-public}
        MAVEN_FALLBACK_MIRROR_URL: ${MAVEN_FALLBACK_MIRROR_URL:-https://repo.huaweicloud.com/repository/maven}
        JRE_IMAGE: ${JRE_IMAGE:-docker.m.daocloud.io/library/eclipse-temurin:21-jre}
        XXL_JOB_VERSION: ${XXL_JOB_VERSION:-3.4.0}
    image: ${XXL_JOB_ADMIN_IMAGE:-lumira/xxl-job-admin:3.4.0}
    container_name: lumira-xxl-job-admin
    restart: unless-stopped
    logging: *id001
    mem_limit: ${XXL_JOB_ADMIN_MEM_LIMIT:-384m}
    cpus: ${XXL_JOB_ADMIN_CPUS:-0.5}
    environment:
      JAVA_OPTS: ${XXL_JOB_ADMIN_JAVA_OPTS:--Xms64m -Xmx256m -XX:+UseG1GC -XX:MaxGCPauseMillis=200
        -Djava.security.egd=file:/dev/./urandom}
      PARAMS: --server.port=8080 --spring.datasource.url=jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-saas}?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
        --spring.datasource.username=root --spring.datasource.password=${DB_PASSWORD:?DB_PASSWORD
        is required} --xxl.job.accessToken=${XXL_JOB_ADMIN_ACCESS_TOKEN:?XXL_JOB_ADMIN_ACCESS_TOKEN
        is required} --xxl.job.login.username=admin --xxl.job.login.password=${XXL_JOB_LOGIN_PASSWORD:?XXL_JOB_LOGIN_PASSWORD
        is required}
      TZ: Asia/Shanghai
    healthcheck:
      test:
      - CMD-SHELL
      - curl -fsS http://127.0.0.1:8080/xxl-job-admin/ >/dev/null
      interval: ${XXL_JOB_ADMIN_HEALTH_INTERVAL:-10s}
      timeout: ${XXL_JOB_ADMIN_HEALTH_TIMEOUT:-5s}
      retries: ${XXL_JOB_ADMIN_HEALTH_RETRIES:-30}
      start_period: ${XXL_JOB_ADMIN_HEALTH_START_PERIOD:-30s}
    networks:
    - default
    - 1panel-network
  api-proxy:
    image: ${NGINX_IMAGE:-docker.m.daocloud.io/library/nginx:1.29-alpine}
    container_name: lumira-api-proxy
    restart: unless-stopped
    logging: *id001
    mem_limit: ${API_PROXY_MEM_LIMIT:-128m}
    cpus: ${API_PROXY_CPUS:-0.25}
    ports:
    - ${API_PROXY_BIND:-127.0.0.1:8000}:80
    volumes:
    - ./nginx/api.conf.template:/etc/nginx/templates/api.conf.template:ro
    - ./.generated/api-proxy:/etc/nginx/lumira-upstreams:ro
  lumira-ui:
    profiles:
    - local-lumira-ui
    build:
      context: ..
      dockerfile: deploy/docker/lumira-ui.Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE:-docker.m.daocloud.io/library/node:22-bookworm-slim}
        NGINX_IMAGE: ${NGINX_IMAGE:-docker.m.daocloud.io/library/nginx:1.29-alpine}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
        NPM_FALLBACK_REGISTRY: ${NPM_FALLBACK_REGISTRY:-https://mirrors.cloud.tencent.com/npm}
        FRONTEND_VERSION: ${FRONTEND_VERSION:-0.1.0}
        BUILD_TIME: ${BUILD_TIME:-}
        GIT_COMMIT: ${GIT_COMMIT:-}
        GIT_BRANCH: ${GIT_BRANCH:-}
    image: ${LUMIRA_FRONTEND_IMAGE:-lumira/lumira-ui:0.1.0}
    container_name: lumira-ui
    restart: unless-stopped
    logging: *id001
    mem_limit: ${FRONTEND_MEM_LIMIT:-128m}
    cpus: ${FRONTEND_CPUS:-0.25}
    ports:
    - ${FRONTEND_BIND:-127.0.0.1:8001}:80
  edge-proxy:
    profiles:
    - edge
    image: ${NGINX_IMAGE:-docker.m.daocloud.io/library/nginx:1.29-alpine}
    container_name: lumira-edge-proxy
    restart: unless-stopped
    logging: *id001
    mem_limit: ${EDGE_PROXY_MEM_LIMIT:-128m}
    cpus: ${EDGE_PROXY_CPUS:-0.25}
    ports:
    - 80:80
    - 443:443
    volumes:
    - ./nginx/edge.conf:/etc/nginx/conf.d/default.conf:ro
    - ./data/tls:/etc/nginx/certs:ro
    depends_on:
    - api-proxy
  prometheus:
    profiles:
    - observability
    image: ${PROMETHEUS_IMAGE:-docker.m.daocloud.io/prom/prometheus@sha256:e4254400b85610324913f0dc4acf92603d9984e7519414c5a12811aa6146acc3}
    container_name: lumira-prometheus
    restart: unless-stopped
    logging: *id001
    command:
    - --config.file=/etc/prometheus/prometheus.yml
    - --storage.tsdb.path=/prometheus
    - --web.enable-lifecycle
    ports:
    - 127.0.0.1:9090:9090
    volumes:
    - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    - prometheus_data:/prometheus
    depends_on:
      mysqld-exporter:
        condition: service_started
      redis-exporter:
        condition: service_started
      backup-metrics-exporter:
        condition: service_started
  mysqld-exporter:
    profiles:
    - observability
    image: ${MYSQLD_EXPORTER_IMAGE:-docker.m.daocloud.io/prom/mysqld-exporter@sha256:eacb4b18e2ec1e0abdf2d64851b68526c964f6d9cb3e9458fb5d5f5062ea94c1}
    container_name: lumira-mysqld-exporter
    restart: unless-stopped
    logging: *id001
    mem_limit: ${MYSQLD_EXPORTER_MEM_LIMIT:-128m}
    cpus: ${MYSQLD_EXPORTER_CPUS:-0.25}
    # Compose file-backed secrets retain root-only host permissions. Start only the
    # fixed bootstrap shell as root, copy TLS material into an in-memory directory,
    # then drop permanently to the image's nobody user before starting the exporter.
    user: "0:0"
    read_only: true
    tmpfs:
    - /run/mysqld-exporter:rw,noexec,nosuid,nodev,mode=0700
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    cap_add:
    - CHOWN
    - DAC_READ_SEARCH
    - SETGID
    - SETUID
    entrypoint:
    - /bin/sh
    - -ec
    - |
      MYSQLD_EXPORTER_PASSWORD="$$(cat /run/secrets/mysql_exporter_password)"
      export MYSQLD_EXPORTER_PASSWORD
      if grep -Eq '^[[:space:]]*\[client\][[:space:]]*$' /run/secrets/mysql_exporter_config; then
        if grep -Eiq '^[[:space:]]*ssl-skip-veri?fication[[:space:]]*=' /run/secrets/mysql_exporter_config; then
          echo 'mysql exporter TLS certificate verification cannot be disabled' >&2
          exit 1
        fi
        if ! grep -Eq '^[[:space:]]*ssl-ca[[:space:]]*=[[:space:]]*"?/run/secrets/mysql_exporter_ca"?[[:space:]]*$' /run/secrets/mysql_exporter_config; then
          echo 'managed MySQL exporter config must use ssl-ca=/run/secrets/mysql_exporter_ca' >&2
          exit 1
        fi
        if ! grep -Eiq '^[[:space:]]*tls[[:space:]]*=[[:space:]]*"?custom"?[[:space:]]*$' /run/secrets/mysql_exporter_config; then
          echo 'managed MySQL exporter config must use tls=custom' >&2
          exit 1
        fi
        install -m 0400 /run/secrets/mysql_exporter_ca /run/mysqld-exporter/mysql_exporter_ca
        chown 65534:65534 /run/mysqld-exporter/mysql_exporter_ca
        printf '%s\n' '[client]' 'ssl-ca=/run/mysqld-exporter/mysql_exporter_ca' 'tls=custom' > /run/mysqld-exporter/mysql_exporter.cnf
        chmod 0400 /run/mysqld-exporter/mysql_exporter.cnf
        chown 65534:65534 /run/mysqld-exporter/mysql_exporter.cnf
        chmod 0700 /run/mysqld-exporter
        chown 65534:65534 /run/mysqld-exporter
        exec /bin/chpst -u nobody:nobody /bin/mysqld_exporter --config.my-cnf=/run/mysqld-exporter/mysql_exporter.cnf "$$@"
      fi
      exec /bin/chpst -u nobody:nobody /bin/mysqld_exporter "$$@"
    - --
    command:
    # mysql:3306 is only the bundled --local-mysql default. Deployment validation must
    # set MYSQLD_EXPORTER_ADDRESS to the DB_URL host:port for every external database.
    - --mysqld.address=${MYSQLD_EXPORTER_ADDRESS:-mysql:3306}
    - --mysqld.username=${MYSQLD_EXPORTER_USERNAME:-exporter}
    - --collect.info_schema.innodb_metrics
    - --collect.info_schema.innodb_tablespaces
    - --collect.info_schema.processlist
    - --collect.info_schema.tables
    - --collect.info_schema.tables.databases=${MYSQL_DATABASE:-saas}
    - --collect.perf_schema.eventsstatements
    - --collect.perf_schema.eventsstatements.limit=${MYSQLD_EXPORTER_EVENTSSTATEMENTS_LIMIT:-100}
    - --collect.perf_schema.tablelocks
    - --collect.perf_schema.replication_group_members
    - --collect.perf_schema.replication_group_member_stats
    - --collect.perf_schema.replication_applier_status_by_worker
    - --web.listen-address=0.0.0.0:9104
    expose:
    - '9104'
    secrets:
    - source: mysql_exporter_password
      target: mysql_exporter_password
    - source: mysql_exporter_config
      target: mysql_exporter_config
    - source: mysql_exporter_ca
      target: mysql_exporter_ca
    healthcheck:
      test:
      - CMD-SHELL
      - wget -qO- http://127.0.0.1:9104/metrics | grep -Eq '^mysql_up(\{[^}]*\})?[[:space:]]+1([.]0+)?([eE][+]?[0]+)?[[:space:]]*$'
      interval: ${MYSQLD_EXPORTER_HEALTH_INTERVAL:-15s}
      timeout: ${MYSQLD_EXPORTER_HEALTH_TIMEOUT:-5s}
      retries: ${MYSQLD_EXPORTER_HEALTH_RETRIES:-5}
      start_period: ${MYSQLD_EXPORTER_HEALTH_START_PERIOD:-10s}
  redis-exporter:
    profiles:
    - observability
    image: ${REDIS_EXPORTER_IMAGE:-docker.m.daocloud.io/oliver006/redis_exporter@sha256:120f7ec77293459ccfdad66bb1db75ab72e8bfeab99f58b1cc2564cadcd7a9e7}
    container_name: lumira-redis-exporter
    restart: unless-stopped
    logging: *id001
    user: "59000:59000"
    read_only: true
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    mem_limit: ${REDIS_EXPORTER_MEM_LIMIT:-64m}
    cpus: ${REDIS_EXPORTER_CPUS:-0.15}
    environment:
      REDIS_ADDR: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    expose:
    - '9121'
    depends_on:
      redis:
        condition: service_started
  backup-metrics-exporter:
    profiles:
    - observability
    image: ${NODE_EXPORTER_IMAGE:-docker.m.daocloud.io/prom/node-exporter@sha256:1b4e4438faca4dd7e001dd445d161a4a2091b0fededa84093b3a8dfeae1f1be0}
    container_name: lumira-backup-metrics-exporter
    restart: unless-stopped
    logging: *id001
    mem_limit: ${BACKUP_METRICS_EXPORTER_MEM_LIMIT:-64m}
    cpus: ${BACKUP_METRICS_EXPORTER_CPUS:-0.10}
    read_only: true
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    command:
    - --collector.disable-defaults
    - --collector.textfile
    - --collector.textfile.directory=/var/lib/node-exporter/textfile
    - --web.listen-address=0.0.0.0:9100
    expose:
    - '9100'
    volumes:
    - ./.generated/backup-metrics:/var/lib/node-exporter/textfile:ro
  loki:
    profiles:
    - observability
    image: ${LOKI_IMAGE:-docker.m.daocloud.io/grafana/loki@sha256:191d4fdfb7264f16989f0a57f320872620a5a7c2ceeec6229212c4190ec49b86}
    container_name: lumira-loki
    restart: unless-stopped
    logging: *id001
    command:
    - -config.file=/etc/loki/config.yml
    ports:
    - 127.0.0.1:3100:3100
    volumes:
    - ./observability/loki-config.yml:/etc/loki/config.yml:ro
    - loki_data:/loki
  tempo:
    profiles:
    - observability
    image: ${TEMPO_IMAGE:-docker.m.daocloud.io/grafana/tempo@sha256:2513658c41faa9197dc7373599bb6119eb27bcb4232cc83779e2bc87cbc34299}
    container_name: lumira-tempo
    restart: unless-stopped
    logging: *id001
    command:
    - -config.file=/etc/tempo/tempo.yml
    ports:
    - 127.0.0.1:3200:3200
    volumes:
    - ./observability/tempo.yml:/etc/tempo/tempo.yml:ro
    - tempo_data:/var/tempo
  alloy:
    profiles:
    - observability
    image: ${ALLOY_IMAGE:-docker.m.daocloud.io/grafana/alloy@sha256:51aeb9d829239345070619dad3edd6873186f913c84f45b365b74574fcb38ec0}
    container_name: lumira-alloy
    restart: unless-stopped
    logging: *id001
    command:
    - run
    - --server.http.listen-addr=0.0.0.0:12345
    - /etc/alloy/config.alloy
    environment:
      OBSERVABILITY_ENVIRONMENT: ${OBSERVABILITY_ENVIRONMENT:-prod}
    ports:
    - 127.0.0.1:12345:12345
    volumes:
    - ./observability/alloy.alloy:/etc/alloy/config.alloy:ro
    - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
    - loki
    - tempo
  grafana:
    profiles:
    - observability
    image: ${GRAFANA_IMAGE:-docker.m.daocloud.io/grafana/grafana@sha256:2d1f9ae67c1778d33e291d4c3c759cd8b650e67491f02533499eb950e075eeb5}
    container_name: lumira-grafana
    restart: unless-stopped
    logging: *id001
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_SMTP_ENABLED: ${GRAFANA_ALERT_EMAIL_ENABLED:-false}
      GF_SMTP_HOST: ${GRAFANA_SMTP_HOST:-}
      GF_SMTP_USER: ${GRAFANA_SMTP_USER:-}
      GF_SMTP_PASSWORD: ${GRAFANA_SMTP_PASSWORD:-}
      GF_SMTP_FROM_ADDRESS: ${GRAFANA_SMTP_FROM_ADDRESS:-alerts@lumira.local}
      GF_SMTP_FROM_NAME: ${GRAFANA_SMTP_FROM_NAME:-Lumira Observability}
    ports:
    - 127.0.0.1:3001:3000
    volumes:
    - grafana_data:/var/lib/grafana
    - ./observability/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
    - ./observability/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
    - ./.generated/grafana-alerting:/etc/grafana/provisioning/alerting:ro
    - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
    - prometheus
    - loki
    - tempo
  lumira-server-blue: &lumira-server
    profiles:
    - blue
    build:
      context: ..
      dockerfile: deploy/docker/service.Dockerfile
      target: lumira-server-image
      args:
        MAVEN_IMAGE: ${MAVEN_IMAGE:-docker.m.daocloud.io/library/maven:3.9.11-eclipse-temurin-21}
        MAVEN_MIRROR_URL: ${MAVEN_MIRROR_URL:-https://mirrors.cloud.tencent.com/nexus/repository/maven-public}
        MAVEN_FALLBACK_MIRROR_URL: ${MAVEN_FALLBACK_MIRROR_URL:-https://repo.huaweicloud.com/repository/maven}
        JRE_IMAGE: ${JRE_IMAGE:-docker.m.daocloud.io/library/eclipse-temurin:21-jre}
        OTEL_JAVAAGENT_URL: ${OTEL_JAVAAGENT_URL:-}
        SERVICE_DIR: services/lumira-admin
        SERVICE_MODULE: services/lumira-admin
    image: ${LUMIRA_SERVER_BLUE_IMAGE:-${LUMIRA_SERVER_IMAGE:-lumira/lumira-server:0.1.0}}
    container_name: lumira-server-blue
    restart: unless-stopped
    stop_grace_period: 60s
    logging:
      driver: json-file
      options:
        max-size: ${DOCKER_LOG_MAX_SIZE:-100m}
        max-file: ${DOCKER_LOG_MAX_FILE:-3}
    mem_limit: ${SYSTEM_SERVICE_MEM_LIMIT:-768m}
    cpus: ${SYSTEM_SERVICE_CPUS:-1.0}
    environment: &lumira-server-env
      TZ: Asia/Shanghai
      SPRING_APPLICATION_JSON: ${SPRING_APPLICATION_JSON:-{"saas":{"system":{"service-base-url":"http://localhost:8080"},"auth":{"service-base-url":"http://localhost:8080"},"file":{"service-base-url":"http://localhost:8080"},"payment":{"service-base-url":"http://localhost:8080"},"team":{"service-base-url":"http://localhost:8080"}}}}
      DB_URL: ${DB_URL:-jdbc:mysql://mysql:3306/saas?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false}
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      LEGENDARY_MONOLITH: 'true'
      LUMIRA_MONOLITH: ${LUMIRA_MONOLITH:-true}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      REDIS_DATABASE: 0
      LUMIRA_EVENT_REVIEW_RESULT_CONSUMER_ENABLED: ${LUMIRA_EVENT_REVIEW_RESULT_CONSUMER_ENABLED:-true}
      LUMIRA_EVENT_REVIEW_RESULT_CONSUMER_STREAM_KEY: ${LUMIRA_EVENT_REVIEW_RESULT_CONSUMER_STREAM_KEY:-saas:platform-events}
      LUMIRA_EVENT_REVIEW_RESULT_CONSUMER_GROUP_NAME: ${LUMIRA_EVENT_REVIEW_RESULT_CONSUMER_GROUP_NAME:-message-review-result-v1}
      SAAS_WORKFLOW_LEGACY_STAGE_REVIEW_ENABLED: ${SAAS_WORKFLOW_LEGACY_STAGE_REVIEW_ENABLED:-false}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SPRING_FLYWAY_ENABLED: ${SPRING_FLYWAY_ENABLED:-false}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      FIELD_SECRET: ${FIELD_SECRET:?FIELD_SECRET is required}
      PLUGIN_SIGNATURE_SECRET: ${PLUGIN_SIGNATURE_SECRET:?PLUGIN_SIGNATURE_SECRET
        is required}
      SAAS_INTERNAL_SYSTEM_TOKEN: ${SAAS_INTERNAL_SYSTEM_TOKEN:?SAAS_INTERNAL_SYSTEM_TOKEN
        is required}
      SAAS_INTERNAL_AUTH_TOKEN: ${SAAS_INTERNAL_AUTH_TOKEN:?SAAS_INTERNAL_AUTH_TOKEN
        is required}
      SAAS_INTERNAL_AUTH_SYSTEM_TOKEN: ${SAAS_INTERNAL_AUTH_SYSTEM_TOKEN:?SAAS_INTERNAL_AUTH_SYSTEM_TOKEN
        is required}
      SAAS_INTERNAL_FILE_TOKEN: ${SAAS_INTERNAL_FILE_TOKEN:?SAAS_INTERNAL_FILE_TOKEN
        is required}
      SAAS_INTERNAL_MESSAGE_TOKEN: ${SAAS_INTERNAL_MESSAGE_TOKEN:?SAAS_INTERNAL_MESSAGE_TOKEN
        is required}
      SAAS_INTERNAL_PAYMENT_TOKEN: ${SAAS_INTERNAL_PAYMENT_TOKEN:?SAAS_INTERNAL_PAYMENT_TOKEN
        is required}
      SAAS_INTERNAL_PLUGIN_TOKEN: ${SAAS_INTERNAL_PLUGIN_TOKEN:?SAAS_INTERNAL_PLUGIN_TOKEN
        is required}
      SAAS_INTERNAL_TEAM_TOKEN: ${SAAS_INTERNAL_TEAM_TOKEN:?SAAS_INTERNAL_TEAM_TOKEN
        is required}
      SAAS_INTERNAL_JOB_TOKEN: ${SAAS_INTERNAL_JOB_TOKEN:?SAAS_INTERNAL_JOB_TOKEN
        is required}
