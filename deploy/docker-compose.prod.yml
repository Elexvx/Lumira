  DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
  SPRING_FLYWAY_ENABLED: ${SPRING_FLYWAY_ENABLED:-false}
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
  REDIS_DATABASE: 0
  JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
  FIELD_SECRET: ${FIELD_SECRET:?FIELD_SECRET is required}
  PLUGIN_SIGNATURE_SECRET: ${PLUGIN_SIGNATURE_SECRET:?PLUGIN_SIGNATURE_SECRET is required}
  WECHAT_LOGIN_ENABLED: ${WECHAT_LOGIN_ENABLED:-false}
  WECHAT_APP_ID: ${WECHAT_APP_ID:-}
  WECHAT_APP_SECRET: ${WECHAT_APP_SECRET:-}
  WECHAT_REDIRECT_URI: ${WECHAT_REDIRECT_URI:-}
  WECHAT_STATE_EXPIRE_MINUTES: ${WECHAT_STATE_EXPIRE_MINUTES:-10}
  TRUST_FORWARDED_HEADERS: 'true'
  JAVA_OPTS: ${JAVA_OPTS:--XX:MaxRAMPercentage=58 -XX:InitialRAMPercentage=18 -XX:MaxMetaspaceSize=192m
    -XX:ReservedCodeCacheSize=96m -Xss512k -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -Djava.security.egd=file:/dev/./urandom}
  SERVER_SHUTDOWN: graceful
  SPRING_LIFECYCLE_TIMEOUT_PER_SHUTDOWN_PHASE: ${SPRING_LIFECYCLE_TIMEOUT_PER_SHUTDOWN_PHASE:-20s}
  SPRING_THREADS_VIRTUAL_ENABLED: ${SPRING_THREADS_VIRTUAL_ENABLED:-true}
  SERVER_COMPRESSION_ENABLED: ${SERVER_COMPRESSION_ENABLED:-true}
  SERVER_COMPRESSION_MIME_TYPES: application/json,application/javascript,text/html,text/xml,text/plain,text/css,image/svg+xml
  SERVER_COMPRESSION_MIN_RESPONSE_SIZE: ${SERVER_COMPRESSION_MIN_RESPONSE_SIZE:-1024}
  SERVER_TOMCAT_THREADS_MAX: ${SERVER_TOMCAT_THREADS_MAX:-80}
  SERVER_TOMCAT_THREADS_MIN_SPARE: ${SERVER_TOMCAT_THREADS_MIN_SPARE:-8}
  SERVER_TOMCAT_ACCEPT_COUNT: ${SERVER_TOMCAT_ACCEPT_COUNT:-120}
  SERVER_TOMCAT_MAX_CONNECTIONS: ${SERVER_TOMCAT_MAX_CONNECTIONS:-4096}
  SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: ${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:-4}
  SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: ${SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE:-1}
  SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT: ${SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT:-3000}
  SPRING_DATASOURCE_HIKARI_VALIDATION_TIMEOUT: ${SPRING_DATASOURCE_HIKARI_VALIDATION_TIMEOUT:-2000}
  SPRING_DATASOURCE_HIKARI_IDLE_TIMEOUT: ${SPRING_DATASOURCE_HIKARI_IDLE_TIMEOUT:-60000}
  SPRING_DATASOURCE_HIKARI_MAX_LIFETIME: ${SPRING_DATASOURCE_HIKARI_MAX_LIFETIME:-600000}
  MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: ${MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED:-true}
  SAAS_TRAFFIC_GATEWAY_AUTH_SERVICE_QPS: ${SAAS_TRAFFIC_GATEWAY_AUTH_SERVICE_QPS:-120}
  SAAS_TRAFFIC_GATEWAY_FILE_SERVICE_QPS: ${SAAS_TRAFFIC_GATEWAY_FILE_SERVICE_QPS:-80}
  SAAS_TRAFFIC_GATEWAY_MESSAGE_SERVICE_QPS: ${SAAS_TRAFFIC_GATEWAY_MESSAGE_SERVICE_QPS:-80}
  SAAS_TRAFFIC_GATEWAY_PLUGIN_SERVICE_QPS: ${SAAS_TRAFFIC_GATEWAY_PLUGIN_SERVICE_QPS:-50}
  SAAS_TRAFFIC_GATEWAY_LOCALIZATION_SERVICE_QPS: ${SAAS_TRAFFIC_GATEWAY_LOCALIZATION_SERVICE_QPS:-80}
  SAAS_TRAFFIC_GATEWAY_SYSTEM_SERVICE_QPS: ${SAAS_TRAFFIC_GATEWAY_SYSTEM_SERVICE_QPS:-160}
  SAAS_TRAFFIC_AUTH_LOGIN_QPS: ${SAAS_TRAFFIC_AUTH_LOGIN_QPS:-20}
  SAAS_TRAFFIC_AUTH_LOGIN_CODE_CHALLENGE_QPS: ${SAAS_TRAFFIC_AUTH_LOGIN_CODE_CHALLENGE_QPS:-20}
  SAAS_TRAFFIC_AUTH_LOGIN_CODE_COMPLETE_QPS: ${SAAS_TRAFFIC_AUTH_LOGIN_CODE_COMPLETE_QPS:-20}
  SAAS_TRAFFIC_AUTH_SECOND_FACTOR_COMPLETE_QPS: ${SAAS_TRAFFIC_AUTH_SECOND_FACTOR_COMPLETE_QPS:-20}
  SAAS_TRAFFIC_AUTH_REFRESH_TOKEN_QPS: ${SAAS_TRAFFIC_AUTH_REFRESH_TOKEN_QPS:-80}
  SAAS_TRAFFIC_AUTH_CURRENT_USER_QPS: ${SAAS_TRAFFIC_AUTH_CURRENT_USER_QPS:-160}
  SAAS_TRAFFIC_SYSTEM_PUBLIC_BRANDING_SETTINGS_QPS: ${SAAS_TRAFFIC_SYSTEM_PUBLIC_BRANDING_SETTINGS_QPS:-80}
  SAAS_TRAFFIC_SYSTEM_PUBLIC_AGREEMENT_SETTINGS_QPS: ${SAAS_TRAFFIC_SYSTEM_PUBLIC_AGREEMENT_SETTINGS_QPS:-80}
  SAAS_TRAFFIC_SYSTEM_PUBLIC_SECURITY_SETTINGS_QPS: ${SAAS_TRAFFIC_SYSTEM_PUBLIC_SECURITY_SETTINGS_QPS:-60}
  SAAS_TRAFFIC_SYSTEM_PUBLIC_LOGIN_CAPABILITIES_QPS: ${SAAS_TRAFFIC_SYSTEM_PUBLIC_LOGIN_CAPABILITIES_QPS:-100}
  SAAS_TRAFFIC_SYSTEM_PUBLIC_CAPTCHA_CHALLENGE_QPS: ${SAAS_TRAFFIC_SYSTEM_PUBLIC_CAPTCHA_CHALLENGE_QPS:-80}
  SAAS_TRAFFIC_SYSTEM_PUBLIC_CAPTCHA_SLIDER_VERIFY_QPS: ${SAAS_TRAFFIC_SYSTEM_PUBLIC_CAPTCHA_SLIDER_VERIFY_QPS:-40}
  CORS_ALLOWED_ORIGIN_PATTERNS: ${CORS_ALLOWED_ORIGIN_PATTERNS:?CORS_ALLOWED_ORIGIN_PATTERNS
    is required}
  SAAS_WEB_CORS_ALLOWED_ORIGIN_PATTERNS: ${CORS_ALLOWED_ORIGIN_PATTERNS:?CORS_ALLOWED_ORIGIN_PATTERNS
    is required}
  FRONTEND_VERSION: ${FRONTEND_VERSION:-0.1.0}
  BACKEND_VERSION: ${BACKEND_VERSION:-0.1.0}
  DATABASE_VERSION: ${DATABASE_VERSION:-unknown}
  APP_VERSION: ${APP_VERSION:-${BACKEND_VERSION:-0.1.0}}
  BUILD_VERSION: ${BUILD_VERSION:-${BACKEND_VERSION:-0.1.0}}
  BUILD_TIME: ${BUILD_TIME:-}
  GIT_COMMIT: ${GIT_COMMIT:-}
  GIT_BRANCH: ${GIT_BRANCH:-}
  OBSERVABILITY_ENVIRONMENT: ${OBSERVABILITY_ENVIRONMENT:-prod}
  OTEL_JAVAAGENT_ENABLED: ${OTEL_JAVAAGENT_ENABLED:-false}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://alloy:4318}
  OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
  OTEL_TRACES_EXPORTER: otlp
  OTEL_METRICS_EXPORTER: none
  OTEL_LOGS_EXPORTER: none
  OTEL_INSTRUMENTATION_LOGBACK_MDC_ENABLED: ${OTEL_INSTRUMENTATION_LOGBACK_MDC_ENABLED:-true}
  OTEL_RESOURCE_ATTRIBUTES: service.namespace=lumira,deployment.environment=${OBSERVABILITY_ENVIRONMENT:-prod},service.version=${BACKEND_VERSION:-${BUILD_VERSION:-0.1.0}},db.version=${DATABASE_VERSION:-unknown}
x-json-logging: &id001
  driver: json-file
  options:
    max-size: ${DOCKER_LOG_MAX_SIZE:-100m}
    max-file: ${DOCKER_LOG_MAX_FILE:-3}
services:
  mysql:
    profiles:
    - local-mysql
    image: mysql:8.4
    container_name: lumira-mysql
    restart: unless-stopped
    logging: *id001
    mem_limit: ${MYSQL_MEM_LIMIT:-768m}
    cpus: ${MYSQL_CPUS:-1.0}
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-saas}
      MYSQL_INITDB_SKIP_TZINFO: '1'
      TZ: Asia/Shanghai
      DATABASE_VERSION: ${DATABASE_VERSION:-unknown}
    command:
    - --character-set-server=utf8mb4
    - --collation-server=utf8mb4_unicode_ci
    volumes:
    - mysql_data:/var/lib/mysql
    - ../lumira-backend/sql/saas.sql:/docker-entrypoint-initdb.d/001-saas.sql:ro
    - ./.generated/database-version/002-database-version.sql:/docker-entrypoint-initdb.d/002-database-version.sql:ro
    healthcheck:
      test:
      - CMD-SHELL
      - mysqladmin ping -h 127.0.0.1 -uroot -p"$${MYSQL_ROOT_PASSWORD}" --silent
      interval: ${MYSQL_HEALTH_INTERVAL:-10s}
      timeout: ${MYSQL_HEALTH_TIMEOUT:-5s}
      retries: ${MYSQL_HEALTH_RETRIES:-30}
      start_period: ${MYSQL_HEALTH_START_PERIOD:-30s}
  redis:
    image: redis:7.4
    container_name: lumira-redis
    restart: unless-stopped
    logging: *id001
    mem_limit: ${REDIS_MEM_LIMIT:-384m}
    cpus: ${REDIS_CPUS:-0.5}
    command: 'sh -c ''if [ -n "$$REDIS_PASSWORD" ]; then redis-server --appendonly
      yes --maxmemory "$${REDIS_MAXMEMORY:-256mb}" --maxmemory-policy allkeys-lru
      --requirepass "$$REDIS_PASSWORD"; else redis-server --appendonly yes --maxmemory
      "$${REDIS_MAXMEMORY:-256mb}" --maxmemory-policy allkeys-lru; fi''

      '
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      REDIS_MAXMEMORY: ${REDIS_MAXMEMORY:-256mb}
      TZ: Asia/Shanghai
    volumes:
    - redis_data:/data
  xxl-job-admin:
    build:
      context: ..
      dockerfile: deploy/docker/xxl-job-admin.Dockerfile
      args:
        MAVEN_IMAGE: ${MAVEN_IMAGE:-maven:3.9.11-eclipse-temurin-21}
        JRE_IMAGE: ${JRE_IMAGE:-eclipse-temurin:21-jre}
        XXL_JOB_VERSION: ${XXL_JOB_VERSION:-3.4.0}
    image: ${XXL_JOB_ADMIN_IMAGE:-lumira/xxl-job-admin:3.4.0}
    container_name: lumira-xxl-job-admin
    restart: unless-stopped
    logging: *id001
    mem_limit: ${XXL_JOB_ADMIN_MEM_LIMIT:-384m}
    cpus: ${XXL_JOB_ADMIN_CPUS:-0.5}
    environment:
      JAVA_OPTS: ${XXL_JOB_ADMIN_JAVA_OPTS:--Xms64m -Xmx256m -XX:+UseG1GC -XX:MaxGCPauseMillis=200
        -Djava.security.egd=file:/dev/./urandom}
      PARAMS: --server.port=8080 --spring.datasource.url=jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-saas}?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
        --spring.datasource.username=root --spring.datasource.password=${DB_PASSWORD:?DB_PASSWORD
        is required} --xxl.job.accessToken=${XXL_JOB_ADMIN_ACCESS_TOKEN:?XXL_JOB_ADMIN_ACCESS_TOKEN
        is required} --xxl.job.login.username=admin --xxl.job.login.password=${XXL_JOB_LOGIN_PASSWORD:?XXL_JOB_LOGIN_PASSWORD
        is required}
      TZ: Asia/Shanghai
    healthcheck:
      test:
      - CMD-SHELL
      - curl -fsS http://127.0.0.1:8080/xxl-job-admin/ >/dev/null
      interval: ${XXL_JOB_ADMIN_HEALTH_INTERVAL:-10s}
      timeout: ${XXL_JOB_ADMIN_HEALTH_TIMEOUT:-5s}
      retries: ${XXL_JOB_ADMIN_HEALTH_RETRIES:-30}
      start_period: ${XXL_JOB_ADMIN_HEALTH_START_PERIOD:-30s}
    networks:
    - default
    - 1panel-network
  api-proxy:
    image: nginx:1.29-alpine
    container_name: lumira-api-proxy
    restart: unless-stopped
    logging: *id001
    mem_limit: ${API_PROXY_MEM_LIMIT:-128m}
    cpus: ${API_PROXY_CPUS:-0.25}
    ports:
    - ${API_PROXY_BIND:-127.0.0.1:8000}:80
    environment:
      GATEWAY_UPSTREAM: ${GATEWAY_UPSTREAM:-lumira-server:8080}
      SYSTEM_SERVICE_UPSTREAM: ${SYSTEM_SERVICE_UPSTREAM:-lumira-server:8080}
      AUTH_SERVICE_UPSTREAM: ${AUTH_SERVICE_UPSTREAM:-lumira-server:8080}
      FILE_SERVICE_UPSTREAM: ${FILE_SERVICE_UPSTREAM:-lumira-server:8080}
      MESSAGE_SERVICE_UPSTREAM: ${MESSAGE_SERVICE_UPSTREAM:-lumira-server:8080}
      PLUGIN_SERVICE_UPSTREAM: ${PLUGIN_SERVICE_UPSTREAM:-lumira-server:8080}
      PAYMENT_SERVICE_UPSTREAM: ${PAYMENT_SERVICE_UPSTREAM:-lumira-server:8080}
      LOCALIZATION_SERVICE_UPSTREAM: ${LOCALIZATION_SERVICE_UPSTREAM:-lumira-server:8080}
      TEAM_SERVICE_UPSTREAM: ${TEAM_SERVICE_UPSTREAM:-lumira-server:8080}
      AI_SERVICE_UPSTREAM: ${AI_SERVICE_UPSTREAM:-lumira-server:8080}
    volumes:
    - ./nginx/api.conf.template:/etc/nginx/templates/api.conf.template:ro
    depends_on:
    - lumira-server
  lumira-ui:
    profiles:
    - local-lumira-ui
    build:
      context: ..
      dockerfile: deploy/docker/lumira-ui.Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:22-bookworm-slim}
        NGINX_IMAGE: ${NGINX_IMAGE:-nginx:1.29-alpine}
        FRONTEND_VERSION: ${FRONTEND_VERSION:-0.1.0}
        BUILD_TIME: ${BUILD_TIME:-}
        GIT_COMMIT: ${GIT_COMMIT:-}
        GIT_BRANCH: ${GIT_BRANCH:-}
    image: ${LUMIRA_FRONTEND_IMAGE:-lumira/lumira-ui:0.1.0}
    container_name: lumira-ui
    restart: unless-stopped
    logging: *id001
    mem_limit: ${FRONTEND_MEM_LIMIT:-128m}
    cpus: ${FRONTEND_CPUS:-0.25}
    ports:
    - ${FRONTEND_BIND:-127.0.0.1:8001}:80
    depends_on:
    - lumira-server
  edge-proxy:
    profiles:
    - edge
    image: nginx:1.29-alpine
    container_name: lumira-edge-proxy
    restart: unless-stopped
    logging: *id001
    mem_limit: ${EDGE_PROXY_MEM_LIMIT:-128m}
    cpus: ${EDGE_PROXY_CPUS:-0.25}
    ports:
    - 80:80
    - 443:443
    volumes:
    - ./nginx/edge.conf:/etc/nginx/conf.d/default.conf:ro
    - ./data/tls:/etc/nginx/certs:ro
    depends_on:
    - api-proxy
  prometheus:
    profiles:
    - observability
    image: ${PROMETHEUS_IMAGE:-prom/prometheus@sha256:e4254400b85610324913f0dc4acf92603d9984e7519414c5a12811aa6146acc3}
    container_name: lumira-prometheus
    restart: unless-stopped
    logging: *id001
    command:
    - --config.file=/etc/prometheus/prometheus.yml
    - --storage.tsdb.path=/prometheus
    - --web.enable-lifecycle
    ports:
    - 127.0.0.1:9090:9090
    volumes:
    - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    - prometheus_data:/prometheus
    depends_on:
    - lumira-server
  loki:
    profiles:
    - observability
    image: ${LOKI_IMAGE:-grafana/loki@sha256:191d4fdfb7264f16989f0a57f320872620a5a7c2ceeec6229212c4190ec49b86}
    container_name: lumira-loki
    restart: unless-stopped
    logging: *id001
    command:
    - -config.file=/etc/loki/config.yml
    ports:
    - 127.0.0.1:3100:3100
    volumes:
    - ./observability/loki-config.yml:/etc/loki/config.yml:ro
    - loki_data:/loki
  tempo:
    profiles:
    - observability
    image: ${TEMPO_IMAGE:-grafana/tempo@sha256:2513658c41faa9197dc7373599bb6119eb27bcb4232cc83779e2bc87cbc34299}
    container_name: lumira-tempo
    restart: unless-stopped
    logging: *id001
    command:
    - -config.file=/etc/tempo/tempo.yml
    ports:
    - 127.0.0.1:3200:3200
    volumes:
    - ./observability/tempo.yml:/etc/tempo/tempo.yml:ro
    - tempo_data:/var/tempo
  alloy:
    profiles:
    - observability
    image: ${ALLOY_IMAGE:-grafana/alloy@sha256:51aeb9d829239345070619dad3edd6873186f913c84f45b365b74574fcb38ec0}
    container_name: lumira-alloy
    restart: unless-stopped
    logging: *id001
    command:
    - run
    - --server.http.listen-addr=0.0.0.0:12345
    - /etc/alloy/config.alloy
    environment:
      OBSERVABILITY_ENVIRONMENT: ${OBSERVABILITY_ENVIRONMENT:-prod}
    ports:
    - 127.0.0.1:12345:12345
    volumes:
    - ./observability/alloy.alloy:/etc/alloy/config.alloy:ro
    - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
    - loki
    - tempo
  grafana:
    profiles:
    - observability
    image: ${GRAFANA_IMAGE:-grafana/grafana@sha256:2d1f9ae67c1778d33e291d4c3c759cd8b650e67491f02533499eb950e075eeb5}
    container_name: lumira-grafana
    restart: unless-stopped
    logging: *id001
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_SMTP_ENABLED: ${GRAFANA_ALERT_EMAIL_ENABLED:-false}
      GF_SMTP_HOST: ${GRAFANA_SMTP_HOST:-}
      GF_SMTP_USER: ${GRAFANA_SMTP_USER:-}
      GF_SMTP_PASSWORD: ${GRAFANA_SMTP_PASSWORD:-}
      GF_SMTP_FROM_ADDRESS: ${GRAFANA_SMTP_FROM_ADDRESS:-alerts@lumira.local}
      GF_SMTP_FROM_NAME: ${GRAFANA_SMTP_FROM_NAME:-Lumira Observability}
    ports:
    - 127.0.0.1:3001:3000
    volumes:
    - grafana_data:/var/lib/grafana
    - ./observability/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
    - ./observability/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
    - ./.generated/grafana-alerting:/etc/grafana/provisioning/alerting:ro
    - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
    - prometheus
    - loki
    - tempo
  lumira-server:
    build:
      context: ..
      dockerfile: deploy/docker/service.Dockerfile
      args:
        MAVEN_IMAGE: ${MAVEN_IMAGE:-maven:3.9.11-eclipse-temurin-21}
        JRE_IMAGE: ${JRE_IMAGE:-eclipse-temurin:21-jre}
        OTEL_JAVAAGENT_URL: ${OTEL_JAVAAGENT_URL:-}
        SERVICE_DIR: services/lumira-admin
        SERVICE_MODULE: services/lumira-admin
    image: ${LUMIRA_SERVER_IMAGE:-lumira/lumira-server:0.1.0}
    container_name: lumira-server
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: ${DOCKER_LOG_MAX_SIZE:-100m}
        max-file: ${DOCKER_LOG_MAX_FILE:-3}
    mem_limit: ${SYSTEM_SERVICE_MEM_LIMIT:-768m}
    cpus: ${SYSTEM_SERVICE_CPUS:-1.0}
    environment:
      TZ: Asia/Shanghai
      NACOS_SERVER_ADDR: ${NACOS_SERVER_ADDR:-nacos:8848}
      NACOS_NAMESPACE: ${NACOS_NAMESPACE:-}
      NACOS_DISCOVERY_ENABLED: ${NACOS_DISCOVERY_ENABLED:-false}
      SPRING_CLOUD_NACOS_CONFIG_ENABLED: ${NACOS_CONFIG_ENABLED:-false}
      SPRING_CLOUD_NACOS_DISCOVERY_ENABLED: ${NACOS_DISCOVERY_ENABLED:-false}
      SPRING_APPLICATION_JSON: ${SPRING_APPLICATION_JSON:-{"saas":{"system":{"service-base-url":"http://localhost:8080"},"auth":{"service-base-url":"http://localhost:8080"},"file":{"service-base-url":"http://localhost:8080"},"payment":{"service-base-url":"http://localhost:8080"},"team":{"service-base-url":"http://localhost:8080"}}}}
      DB_URL: ${DB_URL:-jdbc:mysql://mysql:3306/saas?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false}
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      LEGENDARY_MONOLITH: 'true'
      LUMIRA_MONOLITH: ${LUMIRA_MONOLITH:-true}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      REDIS_DATABASE: 0
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SPRING_FLYWAY_ENABLED: ${SPRING_FLYWAY_ENABLED:-false}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      FIELD_SECRET: ${FIELD_SECRET:?FIELD_SECRET is required}
      LUMIRA_INITIAL_ADMIN_PASSWORD: ${LUMIRA_INITIAL_ADMIN_PASSWORD:-}
      PLUGIN_SIGNATURE_SECRET: ${PLUGIN_SIGNATURE_SECRET:?PLUGIN_SIGNATURE_SECRET
        is required}
      SAAS_INTERNAL_SYSTEM_TOKEN: ${SAAS_INTERNAL_SYSTEM_TOKEN:?SAAS_INTERNAL_SYSTEM_TOKEN
        is required}
      SAAS_INTERNAL_AUTH_TOKEN: ${SAAS_INTERNAL_AUTH_TOKEN:?SAAS_INTERNAL_AUTH_TOKEN
        is required}
      SAAS_INTERNAL_AUTH_SYSTEM_TOKEN: ${SAAS_INTERNAL_AUTH_SYSTEM_TOKEN:?SAAS_INTERNAL_AUTH_SYSTEM_TOKEN
        is required}
      SAAS_INTERNAL_FILE_TOKEN: ${SAAS_INTERNAL_FILE_TOKEN:?SAAS_INTERNAL_FILE_TOKEN
        is required}
      SAAS_INTERNAL_MESSAGE_TOKEN: ${SAAS_INTERNAL_MESSAGE_TOKEN:?SAAS_INTERNAL_MESSAGE_TOKEN
        is required}
      SAAS_INTERNAL_PAYMENT_TOKEN: ${SAAS_INTERNAL_PAYMENT_TOKEN:?SAAS_INTERNAL_PAYMENT_TOKEN
        is required}
      SAAS_INTERNAL_PLUGIN_TOKEN: ${SAAS_INTERNAL_PLUGIN_TOKEN:?SAAS_INTERNAL_PLUGIN_TOKEN
        is required}
      SAAS_INTERNAL_TEAM_TOKEN: ${SAAS_INTERNAL_TEAM_TOKEN:?SAAS_INTERNAL_TEAM_TOKEN
        is required}
      SAAS_INTERNAL_JOB_TOKEN: ${SAAS_INTERNAL_JOB_TOKEN:?SAAS_INTERNAL_JOB_TOKEN
        is required}
      SYSTEM_SERVICE_BASE_URL: ${SYSTEM_SERVICE_BASE_URL:-http://localhost:8080}
