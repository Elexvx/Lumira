                type: prometheus
                uid: prometheus
              editorMode: code
              expr: |
                sum(increase(mysql_global_status_slow_queries{job="mysql"}[5m])) > 10
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 900
              to: 0
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              reducer: last
              refId: B
              type: reduce
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 900
              to: 0
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations:
          summary: "MySQL recorded more than 10 slow queries in five minutes."
          description: "Use Performance Schema statement digests and EXPLAIN ANALYZE to identify the responsible queries."
        labels:
          severity: warning
          service_namespace: lumira

      - uid: lumira-mysql-lock-waits
