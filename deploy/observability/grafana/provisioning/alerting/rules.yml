              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 900
              to: 0
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              reducer: last
              refId: B
              type: reduce
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 900
              to: 0
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 1m
        annotations:
          summary: "InnoDB deadlocks occurred in the last five minutes."
          description: "Review the latest deadlock details and transaction lock ordering."
        labels:
          severity: warning
          service_namespace: lumira

      - uid: lumira-mysql-replication-unhealthy
        title: Lumira MySQL replication unhealthy
        condition: C
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 900
              to: 0
            model:
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: |
                max(
                  (mysql_slave_status_slave_io_running{job="mysql"} == 0)
                  or (mysql_slave_status_replica_io_running{job="mysql"} == 0)
                  or (mysql_slave_status_slave_sql_running{job="mysql"} == 0)
                  or (mysql_slave_status_replica_sql_running{job="mysql"} == 0)
                  or (mysql_perf_schema_replication_group_member_info{job="mysql",member_state!="ONLINE"} == 1)
                ) > 0
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 900
              to: 0
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              reducer: last
              refId: B
              type: reduce
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 900
              to: 0
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 2m
        annotations:
          summary: "A configured MySQL replication channel or group member is unhealthy."
          description: "The rule remains silent on standalone instances because replication metrics are absent there."
        labels:
          severity: critical
          service_namespace: lumira

      - uid: lumira-mysql-replication-lag
        title: Lumira MySQL replication lag high
        condition: C
