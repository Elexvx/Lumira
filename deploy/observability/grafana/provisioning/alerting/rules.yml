        execErrState: Error
        for: 10m
        annotations:
          summary: "MySQL storage usage is above 80 percent."
          description: "This rule consumes the optional lumira_mysql_storage_used_ratio metric from managed database or host storage monitoring."
        labels:
          severity: warning
