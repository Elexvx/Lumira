            model:
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: |
                max(hikaricp_connections_pending{job="lumira-server"}) > 0
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 900
              to: 0
            model:
              datasource:
                type: __expr__
