          description: "Tune the threshold after observing the chosen high availability topology under normal load."
        labels:
          severity: warning
          service_namespace: lumira

      - uid: lumira-mysql-backup-stale
        title: Lumira MySQL backup stale
        condition: C
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 900
              to: 0
            model:
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: |
                (time() - max(lumira_mysql_backup_last_success_timestamp_seconds{job="backup-metrics"})) > 93600
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 900
              to: 0
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              reducer: last
              refId: B
              type: reduce
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 900
              to: 0
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: Alerting
        execErrState: Error
        for: 15m
        annotations:
          summary: "No successful MySQL backup was observed within 26 hours."
          description: "The backup workflow must atomically publish lumira_mysql_backup_last_success_timestamp_seconds through the mounted textfile directory."
        labels:
          severity: critical
          service_namespace: lumira

