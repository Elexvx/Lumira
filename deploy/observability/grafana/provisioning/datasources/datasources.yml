apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      timeInterval: 15s

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      derivedFields:
        - name: traceId
          matcherRegex: "(?:traceId|trace_id|traceID|otelTraceId)[=: ]+([0-9a-fA-F]{32})"
          datasourceUid: tempo
          url: "$${__value.raw}"
        - name: spanId
          matcherRegex: "(?:spanId|span_id)[=: ]+([0-9a-fA-F]{16})"
          url: "$${__value.raw}"
        - name: requestId
          matcherRegex: "(?:requestId|request_id)[=: ]+([A-Za-z0-9._:-]+)"
          url: "$${__value.raw}"

  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    jsonData:
      tracesToLogsV2:
        datasourceUid: loki
        filterByTraceID: true
        filterBySpanID: false
        tags:
          - key: service.name
            value: service_name
      serviceMap:
        datasourceUid: prometheus
