global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090

  - job_name: lumira-server
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - lumira-server:8080
        labels:
          service_name: lumira-server
