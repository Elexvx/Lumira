<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
<meta http-equiv="X-UA-Compatible" content="ie=edge">
<link rel="stylesheet" href="/umi.css">
<script>(function(){try{var storageKey="saas:portal:theme_preference";var preference="system";var raw=localStorage.getItem(storageKey);if(raw!==null){try{preference=JSON.parse(raw);}catch(_error){preference="system";}}if(preference!=="system"&&preference!=="light"&&preference!=="dark"&&preference!=="compact"){preference="system";}var systemDark=false;if(preference==="system"&&typeof window.matchMedia==="function"){systemDark=window.matchMedia("(prefers-color-scheme: dark)").matches;}var resolved=preference==="dark"||(preference==="system"&&systemDark)?"dark":"light";var root=document.documentElement;var backgroundColor=resolved==="dark"?"#0f1115":"#f5f5f5";root.dataset.theme=resolved;root.dataset.themePreference=preference;root.dataset.themeDensity=preference==="compact"?"compact":"normal";root.style.colorScheme=resolved;root.style.backgroundColor=backgroundColor;if(document.body){document.body.style.backgroundColor=backgroundColor;}}catch(_error){}})();</script>
<script src="/preload_helper.js"></script>
</head>
<body>
<div id="root"></div>
<script src="/umi.js"></script>
</body>
</html>
