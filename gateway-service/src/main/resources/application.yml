spring:
  application:
    name: gateway-service
  config:
    import:
      - optional:nacos:gateway-service.yaml?refreshEnabled=true&group=DEFAULT_GROUP
  cloud:
    sentinel:
      filter:
        enabled: false
      scg:
        fallback:
          mode: response
      transport:
        port: ${SENTINEL_TRANSPORT_PORT:8718}
    nacos:
      config:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        file-extension: yaml
        namespace: ${NACOS_NAMESPACE:}
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        namespace: ${NACOS_NAMESPACE:}
        enabled: ${NACOS_DISCOVERY_ENABLED:false}
    gateway:
      default-filters:
        - RemoveRequestHeader=Cookie
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns:
              - http://localhost:*
              - http://127.0.0.1:*
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
              - OPTIONS
            allowedHeaders: "*"
            exposedHeaders: "*"
            allowCredentials: true
      routes:
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/v1/auth/**
        - id: file-service
          uri: lb://file-service
          predicates:
            - Path=/api/v1/files/**,/api/uploads/**
        - id: message-service
          uri: lb://message-service
          predicates:
            - Path=/api/v1/message/**,/ws/message
        - id: plugin-service
          uri: lb://plugin-service
          predicates:
            - Path=/api/v1/plugins/**
        - id: audit-service
          uri: lb://audit-service
          predicates:
            - Path=/api/v1/audit/**
        - id: localization-service
          uri: lb://localization-service
          predicates:
            - Path=/api/v1/localization/**
        - id: system-service
          uri: lb://system-service
          predicates:
            - Path=/api/v1/system/**
        - id: tenant-service
          uri: lb://tenant-service
          predicates:
            - Path=/api/v1/tenant/**

server:
  port: ${SERVER_PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway,sentinel
