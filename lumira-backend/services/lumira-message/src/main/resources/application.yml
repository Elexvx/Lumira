spring:
  application:
    name: message-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:prod}
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/lumira?useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: ${FLYWAY_ENABLED:false}
    baseline-on-migrate: true
    validate-on-migrate: false
    locations:
      - classpath:db/migration
    ignore-migration-patterns:
      - "*:missing"

server:
  port: ${SERVER_PORT:8080}

lumira:
  monolith: ${LUMIRA_MONOLITH:false}
  runtime:
    control-plane-enabled: ${LUMIRA_RUNTIME_CONTROL_PLANE_ENABLED:true}
  event:
    review-result-consumer:
      enabled: ${LUMIRA_EVENT_REVIEW_RESULT_CONSUMER_ENABLED:false}
      stream-key: ${LUMIRA_EVENT_REVIEW_RESULT_CONSUMER_STREAM_KEY:${SAAS_EVENT_REDIS_STREAM_KEY:saas:platform-events}}
      group-name: ${LUMIRA_EVENT_REVIEW_RESULT_CONSUMER_GROUP_NAME:message-review-result-v1}
      consumer-name: ${LUMIRA_EVENT_REVIEW_RESULT_CONSUMER_NAME:}

spring.cloud.nacos.discovery.enabled: false
spring.cloud.nacos.config.enabled: false
spring.cloud.sentinel.enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
      service: ${spring.application.name}

saas:
  security:
    jwt-secret: ${JWT_SECRET:}
    field-secret: ${FIELD_SECRET:}
    permit-paths:
      - /ws/message
      - /api/version
      - /api/v1/version
      - /api/v1/*/version
      - /actuator/health
      - /actuator/info
      - /api/health
      - /api/v2/message/readiness
      - /api/v2/message/health
      - /api/v2/message/metrics
      - /error
  web:
    cors-allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:}
