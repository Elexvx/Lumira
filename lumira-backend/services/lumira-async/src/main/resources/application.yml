spring:
  lifecycle:
    timeout-per-shutdown-phase: 55s
  application:
    name: ${SPRING_APPLICATION_NAME:lumira-async}
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:prod}
  main:
    allow-bean-definition-overriding: false
    keep-alive: ${SPRING_MAIN_KEEP_ALIVE:true}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}

server:
  port: ${SERVER_PORT:8080}

lumira:
  runtime:
    # The worker owns no business tables or control-plane bean graph.
    control-plane-enabled: ${LUMIRA_RUNTIME_CONTROL_PLANE_ENABLED:false}
    async-enabled: ${LUMIRA_RUNTIME_ASYNC_ENABLED:true}
  async:
    owner-relay:
      # Always use api-proxy so the worker follows the active blue/green server slot.
      control-plane-base-url: ${LUMIRA_ASYNC_CONTROL_PLANE_BASE_URL:http://api-proxy:80}
  internal-http:
    connect-timeout: ${LUMIRA_INTERNAL_HTTP_CONNECT_TIMEOUT:2s}
    response-timeout: ${LUMIRA_INTERNAL_HTTP_RESPONSE_TIMEOUT:5s}
    max-response-bytes: ${LUMIRA_INTERNAL_HTTP_MAX_RESPONSE_BYTES:1048576}
    max-attempts: ${LUMIRA_INTERNAL_HTTP_MAX_ATTEMPTS:2}
    retry-backoff: ${LUMIRA_INTERNAL_HTTP_RETRY_BACKOFF:100ms}
  alerting:
    worker:
      enabled: ${LUMIRA_ALERTING_WORKER_ENABLED:true}
      initial-delay-ms: ${LUMIRA_ALERTING_WORKER_INITIAL_DELAY_MS:10000}
      fixed-delay-ms: ${LUMIRA_ALERTING_WORKER_FIXED_DELAY_MS:15000}
  event:
    relay-loop:
      enabled: ${LUMIRA_EVENT_RELAY_LOOP_ENABLED:true}
      initial-delay-ms: ${LUMIRA_EVENT_RELAY_INITIAL_DELAY_MS:3000}
      fixed-delay-ms: ${LUMIRA_EVENT_RELAY_FIXED_DELAY_MS:500}
      queue-capacity: ${LUMIRA_EVENT_RELAY_QUEUE_CAPACITY:1}
      max-concurrency: ${LUMIRA_EVENT_RELAY_MAX_CONCURRENCY:1}
      retry-budget: ${LUMIRA_EVENT_RELAY_RETRY_BUDGET:1}
      retry-backoff: ${LUMIRA_EVENT_RELAY_RETRY_BACKOFF:100ms}
      circuit-failure-threshold: ${LUMIRA_EVENT_RELAY_CIRCUIT_FAILURE_THRESHOLD:3}
      circuit-open-duration: ${LUMIRA_EVENT_RELAY_CIRCUIT_OPEN_DURATION:30s}
      completion-timeout: ${LUMIRA_EVENT_RELAY_COMPLETION_TIMEOUT:8s}
    payment-consumer:
      enabled: ${LUMIRA_PAYMENT_EVENT_CONSUMER_ENABLED:true}
      stream-key: ${LUMIRA_PAYMENT_EVENT_CONSUMER_STREAM_KEY:lumira.events.payment.v1}
      group-name: ${LUMIRA_PAYMENT_EVENT_CONSUMER_GROUP_NAME:competition-payment-v1}
      consumer-name: ${LUMIRA_PAYMENT_EVENT_CONSUMER_NAME:}
      # Do not claim messages still being processed by another consumer.
      pending-recovery-minimum-idle: ${LUMIRA_PAYMENT_EVENT_CONSUMER_PENDING_RECOVERY_MINIMUM_IDLE:30s}
      pending-recovery-interval: ${LUMIRA_PAYMENT_EVENT_CONSUMER_PENDING_RECOVERY_INTERVAL:30s}
      max-delivery-count: ${LUMIRA_PAYMENT_EVENT_CONSUMER_MAX_DELIVERY_COUNT:8}
      # XADD MAXLEN is applied to both the source stream and DLQ. Values are
      # intentionally independent because DLQ review normally spans longer.
      stream-max-length: ${REDIS_RUNTIME_STREAM_MAXLEN:100000}
      dead-letter-max-length: ${REDIS_RUNTIME_DLQ_MAXLEN:50000}

management:
  endpoint:
    health:
      probes:
        enabled: ${MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED:true}
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
      service: ${spring.application.name}

# These are the only cross-runtime credentials accepted by the stateless relay.
saas:
  internal:
    file-token: ${SAAS_INTERNAL_FILE_TOKEN:}
    message-token: ${SAAS_INTERNAL_MESSAGE_TOKEN:}
    payment-token: ${SAAS_INTERNAL_PAYMENT_TOKEN:}
    plugin-token: ${SAAS_INTERNAL_PLUGIN_TOKEN:}
    job-token: ${SAAS_INTERNAL_JOB_TOKEN:}
