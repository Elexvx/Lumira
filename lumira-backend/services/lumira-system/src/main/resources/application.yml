spring:
  application:
    name: system-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:prod}
  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE:50MB}
      max-request-size: ${MAX_REQUEST_SIZE:50MB}
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/lumira?useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
  flyway:
    enabled: ${FLYWAY_ENABLED:false}
    baseline-on-migrate: true
    validate-on-migrate: false
    locations:
      - classpath:db/migration
    ignore-migration-patterns:
      - "*:missing"
    placeholders:
      defaultAdminInitEnabled: ${DEFAULT_ADMIN_INIT_ENABLED:false}
      defaultAdminPasswordHash: ${DEFAULT_ADMIN_PASSWORD_HASH:}

server:
  port: ${SERVER_PORT:8080}

lumira:
  monolith: ${LUMIRA_MONOLITH:false}
  runtime:
    control-plane-enabled: ${LUMIRA_RUNTIME_CONTROL_PLANE_ENABLED:true}

spring.cloud.nacos.discovery.enabled: false
spring.cloud.nacos.config.enabled: false
spring.cloud.sentinel.enabled: false

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

saas:
  web:
    cors-allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:}
    trust-forwarded-headers: ${TRUST_FORWARDED_HEADERS:false}
    trusted-proxy-cidrs:
      - 127.0.0.1/32
      - ::1/128
  security:
    jwt-secret: ${JWT_SECRET:}
    field-secret: ${FIELD_SECRET:}
    issuer: ${JWT_ISSUER:saas-foundation}
    idle-timeout-seconds: ${IDLE_TIMEOUT_SECONDS:1800}
    access-token-expire-seconds: ${ACCESS_TOKEN_EXPIRE_SECONDS:1800}
    refresh-token-expire-seconds: ${REFRESH_TOKEN_EXPIRE_SECONDS:604800}
    captcha-enabled: ${CAPTCHA_ENABLED:false}
    captcha-type: ${CAPTCHA_TYPE:IMAGE}
    permit-paths:
      - /api/v1/auth/login
      - /api/v1/auth/login/code/challenge
      - /api/v1/auth/login/code/complete
      - /api/v1/auth/password-reset/challenge
      - /api/v1/auth/password-reset/complete
      - /api/v1/auth/login-encryption-key
      - /api/v2/auth/login
      - /api/v2/auth/login/code/challenge
      - /api/v2/auth/login/code/complete
      - /api/v2/auth/login-encryption-key
      - /api/v1/auth/wechat/authorize-url
      - /api/v1/auth/wechat/login
      - /api/v1/auth/passkeys/authentication/options
      - /api/v1/auth/passkeys/authentication/complete
      - /api/v1/auth/second-factor/complete
      - /api/v1/auth/refresh-token
      - /api/v2/auth/refresh-token
      - /ws/message
      - /api/v1/public/bootstrap
      - /api/v1/public/branding-settings
      - /api/v1/public/agreement-settings
      - /api/v1/public/login-capabilities
      - /api/v1/public/security-settings
      - /api/v1/public/aiadc/activities
      - /api/v1/public/captcha/**
      - /api/v2/account-activation/**
      - /api/v2/platform/public/bootstrap
      - /api/v2/localization/runtime/**
      - /api/v1/payment/webhooks/**
      - /api/v2/payment/webhook/**
      - /api/v2/payment/webhooks/**
      - /api/uploads/**
      - /actuator/health
      - /actuator/info
      - /api/health
      - /api/v2/*/readiness
      - /api/v2/*/health
      - /api/v2/*/metrics
      - /api/version
      - /api/v1/version
      - /api/v1/*/version
      - /api/v2/runtime/version
      - /error
  event:
    outbox:
      relay-enabled: ${SAAS_EVENT_OUTBOX_RELAY_ENABLED:false}
      batch-size: ${SAAS_EVENT_OUTBOX_BATCH_SIZE:100}
      max-drain-rounds: ${SAAS_EVENT_OUTBOX_MAX_DRAIN_ROUNDS:4}
      dispatcher: ${SAAS_EVENT_OUTBOX_DISPATCHER:logging}
      redis-stream-key: ${SAAS_EVENT_OUTBOX_REDIS_STREAM_KEY:saas:platform-events}
  workflow:
    legacy-stage-review-enabled: ${SAAS_WORKFLOW_LEGACY_STAGE_REVIEW_ENABLED:false}
  plugin:
    platform-version: ${PLUGIN_PLATFORM_VERSION:0.1.0}
    api-version: ${PLUGIN_API_VERSION:1.0.0}
    storage-root: ${PLUGIN_STORAGE_ROOT:storage/plugins}
    staging-root: ${PLUGIN_STAGING_ROOT:storage/plugin-staging}
    signature-secret: ${PLUGIN_SIGNATURE_SECRET:}
    shared-deps-version: ${PLUGIN_SHARED_DEPS_VERSION:1}
  upload:
    storage-root: ${UPLOAD_STORAGE_ROOT:storage/uploads}
    public-path: ${UPLOAD_PUBLIC_PATH:/api/uploads}
    max-image-size-bytes: ${UPLOAD_MAX_IMAGE_SIZE_BYTES:5242880}
    max-document-size-bytes: ${UPLOAD_MAX_DOCUMENT_SIZE_BYTES:52428800}

logging:
  config: classpath:logback-spring.xml

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
      service: ${spring.application.name}
