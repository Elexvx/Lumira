spring:
  lifecycle:
    timeout-per-shutdown-phase: 55s
  application:
    name: ${SPRING_APPLICATION_NAME:lumira-job-executor}
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:prod}
  main:
    keep-alive: ${SPRING_MAIN_KEEP_ALIVE:true}
    allow-bean-definition-overriding: false

server:
  port: ${SERVER_PORT:8080}

lumira:
  runtime:
    async-enabled: ${LUMIRA_RUNTIME_ASYNC_ENABLED:true}

management:
  endpoint:
    health:
      probes:
        enabled: ${MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED:true}
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
      service: ${spring.application.name}

saas:
  job:
    # Production has two remote runtime targets: Async owner-job handlers and
    # the active control-plane slot. Per-service names remain only as legacy
    # local/split-deployment fallbacks and are not part of the deploy contract.
    backend-base-url: ${SAAS_JOB_ASYNC_RUNTIME_BASE_URL:${SAAS_JOB_BACKEND_BASE_URL:http://localhost:${server.port}}}
    system-service-base-url: ${SAAS_JOB_CONTROL_PLANE_BASE_URL:${SAAS_JOB_SYSTEM_SERVICE_BASE_URL:${SAAS_JOB_ASYNC_RUNTIME_BASE_URL:${SAAS_JOB_BACKEND_BASE_URL:http://localhost:${server.port}}}}}
    message-service-base-url: ${SAAS_JOB_ASYNC_RUNTIME_BASE_URL:${SAAS_JOB_MESSAGE_SERVICE_BASE_URL:${SAAS_JOB_BACKEND_BASE_URL:http://localhost:${server.port}}}}
    file-service-base-url: ${SAAS_JOB_ASYNC_RUNTIME_BASE_URL:${SAAS_JOB_FILE_SERVICE_BASE_URL:${SAAS_JOB_BACKEND_BASE_URL:http://localhost:${server.port}}}}
    payment-service-base-url: ${SAAS_JOB_ASYNC_RUNTIME_BASE_URL:${SAAS_JOB_PAYMENT_SERVICE_BASE_URL:${SAAS_JOB_BACKEND_BASE_URL:http://localhost:${server.port}}}}
    plugin-service-base-url: ${SAAS_JOB_ASYNC_RUNTIME_BASE_URL:${SAAS_JOB_PLUGIN_SERVICE_BASE_URL:${SAAS_JOB_BACKEND_BASE_URL:http://localhost:${server.port}}}}
    internal:
      file-token: ${SAAS_INTERNAL_FILE_TOKEN:}
      message-token: ${SAAS_INTERNAL_MESSAGE_TOKEN:}
      payment-token: ${SAAS_INTERNAL_PAYMENT_TOKEN:}
      plugin-token: ${SAAS_INTERNAL_PLUGIN_TOKEN:}
      job-token: ${SAAS_INTERNAL_JOB_TOKEN:}
    internal-http:
      connect-timeout: ${LUMIRA_INTERNAL_HTTP_CONNECT_TIMEOUT:2s}
      response-timeout: ${LUMIRA_INTERNAL_HTTP_RESPONSE_TIMEOUT:5s}
      max-response-bytes: ${LUMIRA_INTERNAL_HTTP_MAX_RESPONSE_BYTES:1048576}
      max-attempts: ${LUMIRA_INTERNAL_HTTP_MAX_ATTEMPTS:2}
      retry-backoff: ${LUMIRA_INTERNAL_HTTP_RETRY_BACKOFF:100ms}
      release-id: ${LUMIRA_RELEASE_ID:unknown}
      schema-version: ${LUMIRA_EVENT_SCHEMA_WRITE_VERSION:1}
xxl:
  job:
    accessToken: ${XXL_JOB_ACCESS_TOKEN:${XXL_JOB_ADMIN_ACCESS_TOKEN:}}
    admin:
      addresses: ${XXL_JOB_ADMIN_ADDRESSES:http://lumira-xxl-job-admin:8080/xxl-job-admin}
      timeout: ${XXL_JOB_ADMIN_TIMEOUT:3}
    executor:
      enabled: ${XXL_JOB_EXECUTOR_ENABLED:false}
      appname: ${XXL_JOB_EXECUTOR_APPNAME:lumira-job-executor}
      address: ${XXL_JOB_EXECUTOR_ADDRESS:}
      ip: ${XXL_JOB_EXECUTOR_IP:}
      port: ${XXL_JOB_EXECUTOR_PORT:9998}
      logpath: ${XXL_JOB_EXECUTOR_LOG_PATH:/tmp/xxl-job/logs}
      logretentiondays: ${XXL_JOB_EXECUTOR_LOG_RETENTION_DAYS:30}
