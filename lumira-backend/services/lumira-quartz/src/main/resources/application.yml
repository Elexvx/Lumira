spring:
  application:
    name: ${SPRING_APPLICATION_NAME:lumira-job-executor}
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:prod}
  main:
    keep-alive: ${SPRING_MAIN_KEEP_ALIVE:true}
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/lumira?useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}

server:
  port: ${SERVER_PORT:8080}

lumira:
  runtime:
    async-enabled: ${LUMIRA_RUNTIME_ASYNC_ENABLED:true}

spring.cloud.nacos.discovery.enabled: false
spring.cloud.nacos.config.enabled: false
spring.cloud.sentinel.enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
      service: ${spring.application.name}

saas:
  security:
    jwt-secret: ${JWT_SECRET:}
    field-secret: ${FIELD_SECRET:}
  job:
    backend-base-url: ${SAAS_JOB_BACKEND_BASE_URL:http://localhost:${server.port}}
    message-service-base-url: ${SAAS_JOB_MESSAGE_SERVICE_BASE_URL:${SAAS_JOB_BACKEND_BASE_URL:http://localhost:${server.port}}}
    file-service-base-url: ${SAAS_JOB_FILE_SERVICE_BASE_URL:${SAAS_JOB_BACKEND_BASE_URL:http://localhost:${server.port}}}
    payment-service-base-url: ${SAAS_JOB_PAYMENT_SERVICE_BASE_URL:${SAAS_JOB_BACKEND_BASE_URL:http://localhost:${server.port}}}
    plugin-service-base-url: ${SAAS_JOB_PLUGIN_SERVICE_BASE_URL:${SAAS_JOB_BACKEND_BASE_URL:http://localhost:${server.port}}}
    internal:
      file-token: ${SAAS_INTERNAL_FILE_TOKEN:}
      message-token: ${SAAS_INTERNAL_MESSAGE_TOKEN:}
      payment-token: ${SAAS_INTERNAL_PAYMENT_TOKEN:}
      plugin-token: ${SAAS_INTERNAL_PLUGIN_TOKEN:}
      job-token: ${SAAS_INTERNAL_JOB_TOKEN:}
    adaptive-relay:
      enabled: ${SAAS_JOB_ADAPTIVE_RELAY_ENABLED:true}
      initial-delay-ms: ${SAAS_JOB_ADAPTIVE_RELAY_INITIAL_DELAY_MS:5000}
      min-delay-ms: ${SAAS_JOB_ADAPTIVE_RELAY_MIN_DELAY_MS:1000}
      max-delay-ms: ${SAAS_JOB_ADAPTIVE_RELAY_MAX_DELAY_MS:30000}
      failure-delay-ms: ${SAAS_JOB_ADAPTIVE_RELAY_FAILURE_DELAY_MS:10000}
      platform-enabled: ${SAAS_JOB_ADAPTIVE_RELAY_PLATFORM_ENABLED:true}
      message-enabled: ${SAAS_JOB_ADAPTIVE_RELAY_MESSAGE_ENABLED:true}
      file-enabled: ${SAAS_JOB_ADAPTIVE_RELAY_FILE_ENABLED:true}
      payment-enabled: ${SAAS_JOB_ADAPTIVE_RELAY_PAYMENT_ENABLED:true}
      plugin-enabled: ${SAAS_JOB_ADAPTIVE_RELAY_PLUGIN_ENABLED:true}
  plugin:
    signature-secret: ${PLUGIN_SIGNATURE_SECRET:}
  web:
    cors-allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:}

xxl:
  job:
    accessToken: ${XXL_JOB_ACCESS_TOKEN:${XXL_JOB_ADMIN_ACCESS_TOKEN:}}
    admin:
      addresses: ${XXL_JOB_ADMIN_ADDRESSES:http://lumira-xxl-job-admin:8080/xxl-job-admin}
      timeout: ${XXL_JOB_ADMIN_TIMEOUT:3}
    executor:
      enabled: ${XXL_JOB_EXECUTOR_ENABLED:false}
      appname: ${XXL_JOB_EXECUTOR_APPNAME:lumira-job-executor}
      address: ${XXL_JOB_EXECUTOR_ADDRESS:}
      ip: ${XXL_JOB_EXECUTOR_IP:}
      port: ${XXL_JOB_EXECUTOR_PORT:9998}
      logpath: ${XXL_JOB_EXECUTOR_LOG_PATH:/tmp/xxl-job/logs}
      logretentiondays: ${XXL_JOB_EXECUTOR_LOG_RETENTION_DAYS:30}
