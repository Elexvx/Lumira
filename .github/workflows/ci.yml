name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_notes:
        description: 'Optional release note for a manually triggered main release'
        required: false
        type: string

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lumira-backend:
    name: Backend Maven Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: |
            lumira-backend/pom.xml
            lumira-backend/**/pom.xml
      - name: Run lumira-backend tests
        working-directory: lumira-backend
        run: ./mvnw -Dmaven.repo.local="$HOME/.m2/repository" clean test

  lumira-ui:
    name: Frontend Lint Typecheck Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lumira-ui
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: lumira-ui/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm run lint
      - name: Typecheck
        run: pnpm run typecheck
      - name: Test
        run: pnpm run test
      - name: Build
        run: pnpm run build

  docker-images:
    name: Docker Images
    runs-on: ubuntu-latest
    needs:
      - lumira-backend
      - lumira-ui
    permissions:
      contents: write
      packages: write
      id-token: write
    env:
      REGISTRY: ghcr.io
      CN_REGISTRY: ${{ vars.CN_REGISTRY }}
      CN_REGISTRY_NAMESPACE: ${{ vars.CN_REGISTRY_NAMESPACE }}
    steps:
      - uses: actions/checkout@v6
      - name: Test updater state machine and deployment contracts
        run: node --test bin/*.test.mjs
      - name: Validate blue-green Compose topology
        run: docker compose --env-file deploy/.env.example -f deploy/docker-compose.prod.yml --profile blue --profile green --profile local-lumira-ui config --quiet
      - name: Rehearse zero-downtime update and rollback with real Docker traffic
        env:
          LUMIRA_DOCKER_E2E: 'true'
        run: node --test bin/lumira-updater-docker-e2e.test.mjs
      - name: Resolve image names
        id: images
        shell: bash
        run: |
          owner="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          short_sha="${GITHUB_SHA::12}"
          echo "lumira_server=${REGISTRY}/${owner}/lumira/lumira-server" >> "$GITHUB_OUTPUT"
          echo "lumira_ui=${REGISTRY}/${owner}/lumira/lumira-ui" >> "$GITHUB_OUTPUT"
          echo "lumira_async=${REGISTRY}/${owner}/lumira/lumira-async" >> "$GITHUB_OUTPUT"
          echo "lumira_job_executor=${REGISTRY}/${owner}/lumira/lumira-job-executor" >> "$GITHUB_OUTPUT"
          echo "lumira_migrator=${REGISTRY}/${owner}/lumira/lumira-migrator" >> "$GITHUB_OUTPUT"
          echo "short_sha=${short_sha}" >> "$GITHUB_OUTPUT"
      - name: Validate database migration contract
        id: database_migrations
        shell: bash
        run: |
          node bin/check-expand-only-migrations.mjs
          node bin/check-database-migrations.mjs
          bin/test-database-bootstrap.sh
          echo "version=$(node bin/check-database-migrations.mjs --print-version)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - name: Login to GitHub Container Registry
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Login to domestic container registry
        if: >-
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
          github.ref == 'refs/heads/main' &&
          env.CN_REGISTRY != '' &&
          env.CN_REGISTRY_NAMESPACE != ''
        uses: docker/login-action@v4
        with:
          registry: ${{ env.CN_REGISTRY }}
          username: ${{ secrets.CN_REGISTRY_USERNAME }}
          password: ${{ secrets.CN_REGISTRY_PASSWORD }}
      - name: Build lumira-server image
        id: build_server
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/service.Dockerfile
          target: lumira-server-image
          build-args: |
            APP_VERSION=main
            BUILD_VERSION=main+${{ github.sha }}
            FRONTEND_VERSION=main+${{ steps.images.outputs.short_sha }}
            BACKEND_VERSION=main+${{ steps.images.outputs.short_sha }}
            DATABASE_VERSION=${{ steps.database_migrations.outputs.version }}
            BUILD_TIME=${{ github.event.head_commit.timestamp || github.run_started_at }}
            GIT_COMMIT=${{ github.sha }}
            GIT_BRANCH=${{ github.ref_name }}
          push: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ steps.images.outputs.lumira_server }}:main
            ${{ steps.images.outputs.lumira_server }}:sha-${{ steps.images.outputs.short_sha }}
          provenance: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' }}
          sbom: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' }}
          cache-from: type=gha,scope=lumira-server
          cache-to: type=gha,mode=max,scope=lumira-server
      - name: Build lumira-ui image
        id: build_ui
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/lumira-ui.Dockerfile
          build-args: |
            FRONTEND_VERSION=main+${{ steps.images.outputs.short_sha }}
            BUILD_TIME=${{ github.event.head_commit.timestamp || github.run_started_at }}
            GIT_COMMIT=${{ github.sha }}
            GIT_BRANCH=${{ github.ref_name }}
          push: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ steps.images.outputs.lumira_ui }}:main
            ${{ steps.images.outputs.lumira_ui }}:sha-${{ steps.images.outputs.short_sha }}
          provenance: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' }}
          sbom: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' }}
          cache-from: type=gha,scope=lumira-ui
          cache-to: type=gha,mode=max,scope=lumira-ui
      - name: Build lumira-async image
        id: build_async
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/service.Dockerfile
          target: lumira-async-image
          build-args: |
            APP_VERSION=main
            BUILD_VERSION=main+${{ github.sha }}
            FRONTEND_VERSION=main+${{ steps.images.outputs.short_sha }}
            BACKEND_VERSION=main+${{ steps.images.outputs.short_sha }}
            DATABASE_VERSION=${{ steps.database_migrations.outputs.version }}
            BUILD_TIME=${{ github.event.head_commit.timestamp || github.run_started_at }}
            GIT_COMMIT=${{ github.sha }}
            GIT_BRANCH=${{ github.ref_name }}
          push: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ steps.images.outputs.lumira_async }}:main
            ${{ steps.images.outputs.lumira_async }}:sha-${{ steps.images.outputs.short_sha }}
          provenance: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' }}
          sbom: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' }}
          cache-from: type=gha,scope=lumira-async
          cache-to: type=gha,mode=max,scope=lumira-async
      - name: Build lumira-job-executor image
        id: build_job_executor
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/service.Dockerfile
          target: lumira-job-executor-image
          build-args: |
            APP_VERSION=main
            BUILD_VERSION=main+${{ github.sha }}
            FRONTEND_VERSION=main+${{ steps.images.outputs.short_sha }}
            BACKEND_VERSION=main+${{ steps.images.outputs.short_sha }}
            DATABASE_VERSION=${{ steps.database_migrations.outputs.version }}
            BUILD_TIME=${{ github.event.head_commit.timestamp || github.run_started_at }}
            GIT_COMMIT=${{ github.sha }}
            GIT_BRANCH=${{ github.ref_name }}
          push: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ steps.images.outputs.lumira_job_executor }}:main
            ${{ steps.images.outputs.lumira_job_executor }}:sha-${{ steps.images.outputs.short_sha }}
          provenance: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' }}
          sbom: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' }}
          cache-from: type=gha,scope=lumira-job-executor
          cache-to: type=gha,mode=max,scope=lumira-job-executor
      - name: Build lumira-migrator image
        id: build_migrator
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/migrator.Dockerfile
          push: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ steps.images.outputs.lumira_migrator }}:main
            ${{ steps.images.outputs.lumira_migrator }}:sha-${{ steps.images.outputs.short_sha }}
          provenance: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' }}
          sbom: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' }}
          cache-from: type=gha,scope=lumira-migrator
          cache-to: type=gha,mode=max,scope=lumira-migrator
      - name: Mirror release images to domestic registry
        id: mirror_images
        if: >-
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
          github.ref == 'refs/heads/main' &&
          env.CN_REGISTRY != '' &&
          env.CN_REGISTRY_NAMESPACE != ''
        shell: bash
        env:
          SERVER_DIGEST: ${{ steps.build_server.outputs.digest }}
          UI_DIGEST: ${{ steps.build_ui.outputs.digest }}
          ASYNC_DIGEST: ${{ steps.build_async.outputs.digest }}
          JOB_EXECUTOR_DIGEST: ${{ steps.build_job_executor.outputs.digest }}
          MIGRATOR_DIGEST: ${{ steps.build_migrator.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p tmp/release
          source_prefix="${REGISTRY}/$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')/lumira"
          target_prefix="${CN_REGISTRY}/${CN_REGISTRY_NAMESPACE}"
          short_sha="${{ steps.images.outputs.short_sha }}"
          image_names=(lumira-server lumira-ui lumira-async lumira-job-executor lumira-migrator)
          image_digests=("${SERVER_DIGEST}" "${UI_DIGEST}" "${ASYNC_DIGEST}" "${JOB_EXECUTOR_DIGEST}" "${MIGRATOR_DIGEST}")
          output_names=(lumira_server_digest lumira_ui_digest lumira_async_digest lumira_job_executor_digest lumira_migrator_digest)
          evidence_args=()

          for index in "${!image_names[@]}"; do
            image_name="${image_names[$index]}"
            source_image="${source_prefix}/${image_name}@${image_digests[$index]}"
            target_image="${target_prefix}/${image_name}"
            source_manifest="$(docker buildx imagetools inspect "${source_image}" --raw)"
            platform_digest="$(
              jq -r '
                if (.manifests | type) == "array" then
                  first(
                    .manifests[]
                    | select(
                        .platform.os == "linux"
                        and .platform.architecture == "amd64"
                        and ((.annotations["vnd.docker.reference.type"] // "") != "attestation-manifest")
                      )
                    | .digest
                  ) // empty
                else
                  empty
                end
              ' <<<"${source_manifest}"
            )"
            if [[ -z "${platform_digest}" ]]; then
              platform_digest="${image_digests[$index]}"
            fi

            docker buildx imagetools create \
              --prefer-index=false \
              --tag "${target_image}:main" \
              --tag "${target_image}:sha-${short_sha}" \
              "${source_prefix}/${image_name}@${platform_digest}"
            target_manifest="$(docker buildx imagetools inspect "${target_image}:sha-${short_sha}" --raw)"
            target_digest="sha256:$(printf '%s' "${target_manifest}" | sha256sum | cut -d' ' -f1)"
            echo "${output_names[$index]}=${target_digest}" >> "$GITHUB_OUTPUT"
            evidence_args+=("${image_name}" "${target_digest}")
          done

          node - "${evidence_args[@]}" <<'NODE'
          const { writeFileSync } = require('node:fs');
          const names = ['lumira-server', 'lumira-ui', 'lumira-async', 'lumira-job-executor', 'lumira-migrator'];
          const values = process.argv.slice(2);
          const digests = Object.fromEntries(
            Array.from({ length: values.length / 2 }, (_, index) => [
              values[index * 2],
              values[index * 2 + 1],
            ]),
          );
          const evidence = {
            commit: process.env.GITHUB_SHA,
            registry: process.env.CN_REGISTRY,
            namespace: process.env.CN_REGISTRY_NAMESPACE,
            digests,
            immutable: Object.fromEntries(names.map((name) => [
              name,
              `${process.env.CN_REGISTRY}/${process.env.CN_REGISTRY_NAMESPACE}/${name}@${digests[name]}`,
            ])),
            tags: Object.fromEntries(names.map((name) => [
              name,
              [
                `${process.env.CN_REGISTRY}/${process.env.CN_REGISTRY_NAMESPACE}/${name}:main`,
                `${process.env.CN_REGISTRY}/${process.env.CN_REGISTRY_NAMESPACE}/${name}:sha-${process.env.GITHUB_SHA.slice(0, 12)}`,
              ],
            ])),
          };
          writeFileSync('tmp/release/domestic-image-mirror-evidence.json', `${JSON.stringify(evidence, null, 2)}\n`);
          NODE
      - name: Write image supply-chain evidence
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          mkdir -p tmp/release
          cat > tmp/release/image-supply-chain-evidence.json <<EOF
          {
            "commit": "${GITHUB_SHA}",
            "shortSha": "${{ steps.images.outputs.short_sha }}",
            "registry": "${REGISTRY}",
            "images": {
              "lumiraServer": {
                "image": "${{ steps.images.outputs.lumira_server }}:sha-${{ steps.images.outputs.short_sha }}",
                "digest": "${{ steps.build_server.outputs.digest }}",
                "sbom": "enabled",
                "provenance": "enabled"
              },
              "lumiraUi": {
                "image": "${{ steps.images.outputs.lumira_ui }}:sha-${{ steps.images.outputs.short_sha }}",
                "digest": "${{ steps.build_ui.outputs.digest }}",
                "sbom": "enabled",
                "provenance": "enabled"
              },
              "lumiraAsync": {
                "image": "${{ steps.images.outputs.lumira_async }}:sha-${{ steps.images.outputs.short_sha }}",
                "digest": "${{ steps.build_async.outputs.digest }}",
                "sbom": "enabled",
                "provenance": "enabled"
              },
              "lumiraJobExecutor": {
                "image": "${{ steps.images.outputs.lumira_job_executor }}:sha-${{ steps.images.outputs.short_sha }}",
                "digest": "${{ steps.build_job_executor.outputs.digest }}",
                "sbom": "enabled",
                "provenance": "enabled"
              },
              "lumiraMigrator": {
                "image": "${{ steps.images.outputs.lumira_migrator }}:sha-${{ steps.images.outputs.short_sha }}",
                "digest": "${{ steps.build_migrator.outputs.digest }}",
                "sbom": "enabled",
                "provenance": "enabled"
              }
            }
          }
          EOF
      - name: Resolve release manifest image registry
        id: release_images
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          if [[ -n "${CN_REGISTRY}" && -n "${CN_REGISTRY_NAMESPACE}" ]]; then
            prefix="${CN_REGISTRY}/${CN_REGISTRY_NAMESPACE}"
            server_digest="${{ steps.mirror_images.outputs.lumira_server_digest }}"
            ui_digest="${{ steps.mirror_images.outputs.lumira_ui_digest }}"
            async_digest="${{ steps.mirror_images.outputs.lumira_async_digest }}"
            job_executor_digest="${{ steps.mirror_images.outputs.lumira_job_executor_digest }}"
            migrator_digest="${{ steps.mirror_images.outputs.lumira_migrator_digest }}"
          else
            prefix="${REGISTRY}/$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')/lumira"
            server_digest="${{ steps.build_server.outputs.digest }}"
            ui_digest="${{ steps.build_ui.outputs.digest }}"
            async_digest="${{ steps.build_async.outputs.digest }}"
            job_executor_digest="${{ steps.build_job_executor.outputs.digest }}"
            migrator_digest="${{ steps.build_migrator.outputs.digest }}"
          fi
          echo "lumira_server=${prefix}/lumira-server" >> "$GITHUB_OUTPUT"
          echo "lumira_ui=${prefix}/lumira-ui" >> "$GITHUB_OUTPUT"
          echo "lumira_async=${prefix}/lumira-async" >> "$GITHUB_OUTPUT"
          echo "lumira_job_executor=${prefix}/lumira-job-executor" >> "$GITHUB_OUTPUT"
          echo "lumira_migrator=${prefix}/lumira-migrator" >> "$GITHUB_OUTPUT"
          echo "lumira_server_digest=${server_digest}" >> "$GITHUB_OUTPUT"
          echo "lumira_ui_digest=${ui_digest}" >> "$GITHUB_OUTPUT"
          echo "lumira_async_digest=${async_digest}" >> "$GITHUB_OUTPUT"
          echo "lumira_job_executor_digest=${job_executor_digest}" >> "$GITHUB_OUTPUT"
          echo "lumira_migrator_digest=${migrator_digest}" >> "$GITHUB_OUTPUT"
      - name: Generate release manifest
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        env:
          GIT_COMMIT: ${{ github.sha }}
          APP_VERSION: main
          LUMIRA_SERVER_IMAGE: ${{ steps.release_images.outputs.lumira_server }}@${{ steps.release_images.outputs.lumira_server_digest }}
          LUMIRA_FRONTEND_IMAGE: ${{ steps.release_images.outputs.lumira_ui }}@${{ steps.release_images.outputs.lumira_ui_digest }}
          LUMIRA_ASYNC_IMAGE: ${{ steps.release_images.outputs.lumira_async }}@${{ steps.release_images.outputs.lumira_async_digest }}
          LUMIRA_JOB_EXECUTOR_IMAGE: ${{ steps.release_images.outputs.lumira_job_executor }}@${{ steps.release_images.outputs.lumira_job_executor_digest }}
          LUMIRA_MIGRATOR_IMAGE: ${{ steps.release_images.outputs.lumira_migrator }}@${{ steps.release_images.outputs.lumira_migrator_digest }}
          LUMIRA_RELEASE_MIGRATION_MODE: expand-only
          LUMIRA_RELEASE_DATABASE_VERSION: ${{ steps.database_migrations.outputs.version }}
          LUMIRA_RELEASE_MIGRATION_REQUIRED: 'true'
          LUMIRA_RELEASE_NOTES: ${{ github.event.head_commit.message || inputs.release_notes || format('Manual release for {0}', github.sha) }}
        run: node bin/generate-release-manifest.mjs
      - name: Publish continuous release manifest
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          if gh release view continuous >/dev/null 2>&1; then
            gh release edit continuous \
              --target "$GITHUB_SHA" \
              --title "Lumira continuous release" \
              --notes-file tmp/release/lumira-release-manifest.json \
              --prerelease
          else
            gh release create continuous \
              --target "$GITHUB_SHA" \
              --title "Lumira continuous release" \
              --notes-file tmp/release/lumira-release-manifest.json \
              --prerelease
          fi
          gh release upload continuous \
            tmp/release/lumira-release-manifest.json \
            tmp/release/image-supply-chain-evidence.json \
            --clobber
      - name: Publish domestic image mirror evidence
        if: >-
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
          github.ref == 'refs/heads/main' &&
          env.CN_REGISTRY != '' &&
          env.CN_REGISTRY_NAMESPACE != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload continuous tmp/release/domestic-image-mirror-evidence.json --clobber
      - name: Upload release manifest
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: lumira-release-manifest
          path: |
            tmp/release/lumira-release-manifest.json
            tmp/release/image-supply-chain-evidence.json
      - name: Upload domestic image mirror evidence
        if: >-
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
          github.ref == 'refs/heads/main' &&
          env.CN_REGISTRY != '' &&
          env.CN_REGISTRY_NAMESPACE != ''
        uses: actions/upload-artifact@v7
        with:
          name: lumira-domestic-image-mirror
          path: tmp/release/domestic-image-mirror-evidence.json
