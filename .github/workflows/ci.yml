name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  backend:
    name: Backend Maven Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run backend tests
        run: mvn clean test

  ddd-gates:
    name: DDD Architecture Performance Gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Shared security contract tests
        run: mvn -pl libs/common-security,libs/common-web -am -Dtest=InternalServiceTokenAuthFilterTest,JwtTokenParserTest,FieldCryptoServiceTest,DataPermissionResolverTest,TraceIdFilterTest -Dsurefire.failIfNoSpecifiedTests=false test
      - name: Architecture boundary tests
        run: mvn -pl services/system-service -am -Dtest=DddArchitectureBoundaryTest,DddArchitectureCatalogControllerTest,OwnerReadModelMetricsServiceTest,IamV2ControllerTest,IamReadinessV2ControllerTest,PlatformReadinessV2ControllerTest,PlatformV2ControllerTest,AiReadinessV2ControllerTest,AiOwnerMetricsServiceTest,AiKnowledgeBaseAppServiceTest,AiKnowledgeVectorServiceTest,RuntimeSecurityPropertiesValidatorTest,DefaultAdminPasswordBaselineTest,RedisStreamPlatformEventDispatcherTest,PlatformEventPublisherTest -Dsurefire.failIfNoSpecifiedTests=false test
      - name: Auth owner readiness contract tests
        run: mvn -pl services/auth-service -am -Dtest=AuthReadinessV2ControllerTest,AuthV2ControllerTest,AuthSessionStoreTest,AuthDomainModelsTest,AuthAppServiceTest -Dsurefire.failIfNoSpecifiedTests=false test
      - name: File owner readiness contract tests
        run: mvn -pl services/file-service -am -Dtest=FileReadinessV2ControllerTest,FileV2ControllerTest,FileUploadMetricsTest,InternalJobControllerTest,FileSecurityScanProcessorTest,FileSecurityScanMetricsTest,InlineFileSecurityScanEngineTest,ClamAvFileSecurityScanEngineTest,FileSecurityScanEngineSelectorTest,FileOcrProcessorTest,FileOcrEngineSelectorTest,FileStorageMetricsTest,DocumentUploadServiceTest,ImageUploadServiceTest,FileThumbnailProcessorTest,FileTextExtractionProcessorTest,FileAiParseProcessorTest,FileProcessingTaskServiceTest,FileProcessingMetricsTest,FileOutboxMetricsServiceTest,PlatformEventOutboxRelayServiceTest,FileOutboxRelayTest -Dsurefire.failIfNoSpecifiedTests=false test
      - name: Message owner readiness contract tests
        run: mvn -pl services/message-service -am -Dtest=MessageReadinessV2ControllerTest,MessageV2ControllerTest,MessageDomainModelsTest,MessageAppServiceTest,PlatformEventOutboxServiceTest,MessageNoticeMapperHotPathSqlTest,MessageEventFactoryTest,MessageEventDeliveryServiceTest,MessageWebSocketTicketServiceTest,MessageSessionHandshakeInterceptorTest -Dsurefire.failIfNoSpecifiedTests=false test
      - name: Plugin owner readiness contract tests
        run: mvn -pl services/plugin-service -am -Dtest=PluginReadinessV2ControllerTest,PluginV2ControllerTest,PluginDomainModelsTest,PluginOutboxServiceTest,PluginManagementAppServiceTest,PluginArchitectureContractTest,PluginRuntimeSecurityPolicyTest,PluginPersistenceServiceTest -Dsurefire.failIfNoSpecifiedTests=false test
      - name: Payment owner readiness contract tests
        run: mvn -pl services/payment-service -am -Dtest=PaymentReadinessV2ControllerTest,PaymentV2ControllerTest,PaymentDomainModelsTest,PaymentOutboxServiceTest,PaymentOutboxRelayTest,InternalJobControllerTest,PaymentWebhookServiceTest,PaymentManagementAppServiceTest -Dsurefire.failIfNoSpecifiedTests=false test
      - name: AI owner standalone contract tests
        run: mvn -pl services/ai-service -am -Dtest=AiReadinessV2ControllerTest,AiV2ControllerTest,AiReadQueryServiceTest,AiCommandServiceTest,RemoteAiOwnerToolGatewayTest,DefaultAiProviderRuntimeTest -Dsurefire.failIfNoSpecifiedTests=false test
      - name: Localization owner readiness contract tests
        run: mvn -pl services/localization-service -am -Dtest=LocalizationReadinessV2ControllerTest,LocalizationV2ControllerTest,LocalizationRuntimeBundleCacheTest,LocalizationDomainModelsTest -Dsurefire.failIfNoSpecifiedTests=false test
      - name: Job relay adapter tests
        run: mvn -pl services/job-executor -am -Dtest=JobReadinessV2ControllerTest,FileOutboxRelayJobHandlerTest,FileProcessingTaskJobHandlerTest,JobDomainModelsTest,XxlJobExecutorConfigTest -Dsurefire.failIfNoSpecifiedTests=false test
      - name: Performance smoke script syntax
        run: |
          node --check scripts/ddd-release-evidence-utils.mjs
          node --check scripts/ddd-release-evidence-utils.test.mjs
