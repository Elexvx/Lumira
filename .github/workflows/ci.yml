  frontend:
    name: Frontend Lint Typecheck Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm run lint
      - name: Typecheck
        run: pnpm run typecheck
      - name: Test
        run: pnpm run test

  docker-images:
    name: Docker Images
    runs-on: ubuntu-latest
    needs:
      - backend
      - ddd-gates
      - frontend
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
    steps:
      - uses: actions/checkout@v4
      - name: Resolve image names
        id: images
        shell: bash
        run: |
          owner="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          short_sha="${GITHUB_SHA::12}"
          echo "lumira_server=${REGISTRY}/${owner}/lumira/lumira-server" >> "$GITHUB_OUTPUT"
          echo "frontend=${REGISTRY}/${owner}/lumira/frontend" >> "$GITHUB_OUTPUT"
          echo "short_sha=${short_sha}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Login to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build lumira-server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/service.Dockerfile
          build-args: |
            SERVICE_DIR=services/lumira-server
            SERVICE_MODULE=services/lumira-server
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ steps.images.outputs.lumira_server }}:main
            ${{ steps.images.outputs.lumira_server }}:sha-${{ steps.images.outputs.short_sha }}
          cache-from: type=gha,scope=lumira-server
          cache-to: type=gha,mode=max,scope=lumira-server
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/frontend.Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ steps.images.outputs.frontend }}:main
            ${{ steps.images.outputs.frontend }}:sha-${{ steps.images.outputs.short_sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
      - name: Generate release manifest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GIT_COMMIT: ${{ github.sha }}
          APP_VERSION: main
          LUMIRA_SERVER_IMAGE: ${{ steps.images.outputs.lumira_server }}:sha-${{ steps.images.outputs.short_sha }}
          LUMIRA_FRONTEND_IMAGE: ${{ steps.images.outputs.frontend }}:sha-${{ steps.images.outputs.short_sha }}
          LUMIRA_RELEASE_NOTES: Lumira main build ${{ steps.images.outputs.short_sha }}
        run: node scripts/generate-release-manifest.mjs
      - name: Upload release manifest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: lumira-release-manifest
          path: artifacts/release/lumira-release-manifest.json
