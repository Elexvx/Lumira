name: Security Scan

on:
  pull_request:
  push:
    branches: [ main, master ]
  schedule:
    - cron: '0 18 * * *'

permissions:
  contents: read
  security-events: write

jobs:
  secret-and-fs-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: SQL dump and credential hash policy
        run: node bin/check-sensitive-sql-dumps.mjs
      - name: Gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks detect --source=. --redact --verbose
      - name: Trivy filesystem vulnerability scan
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
          trivyignores: .trivyignore.yaml
          limit-severities-for-sarif: true
      - name: Upload Trivy findings
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif

  dependency-and-code-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: lumira-ui/pnpm-lock.yaml
      - name: Install frontend dependencies
        working-directory: lumira-ui
        run: pnpm install --frozen-lockfile
      - name: Verify reviewed brace-expansion security backports
        run: node bin/check-brace-expansion-backports.mjs
      # GHSA-mh99-v99m-4gvg models all legacy releases as vulnerable, but the
      # lockfile pins the upstream CVE-2026-14257 backports (1.1.18/2.1.4).
      - name: Frontend production audit
        working-directory: lumira-ui
        run: pnpm audit --prod --audit-level high --ignore GHSA-mh99-v99m-4gvg --json > ../security-pnpm-audit.json
      - name: OSV scanner
        uses: google/osv-scanner-action/osv-scanner-action@9a498708959aeaef5ef730655706c5a1df1edbc2 # v2.3.8
        with:
          scan-args: |-
            --format=json
            --output=security-osv.json
            --config=.osv-scanner.toml
            --lockfile=./lumira-ui/pnpm-lock.yaml
      - name: Semgrep Java and TypeScript rules
        uses: semgrep/semgrep-action@713efdd345f3035192eaa63f56867b88e63e4e5d # v1
        with:
          config: >-
            p/java
            p/typescript
            p/secrets
      - name: Upload dependency scan reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-scan-reports
          path: |
            security-*.json
