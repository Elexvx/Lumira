name: Security Scan

on:
  pull_request:
  push:
    branches: [ main, master ]
  schedule:
    - cron: '0 18 * * *'

permissions:
  contents: read
  security-events: write

jobs:
  secret-and-fs-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  dependency-and-code-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: lumira-ui/pnpm-lock.yaml
      - name: Install frontend dependencies
        working-directory: lumira-ui
        run: pnpm install --frozen-lockfile
      - name: Frontend production audit
        working-directory: lumira-ui
        run: pnpm audit --prod
      - name: OSV scanner
        uses: google/osv-scanner-action/osv-scanner-action@v2.0.3
        with:
          scan-args: |-
            --recursive
            .
      - name: Semgrep Java and TypeScript rules
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/java
            p/typescript
            p/secrets
