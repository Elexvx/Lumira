name: Security Scan

on:
  pull_request:
  push:
    branches: [ main, master ]
  schedule:
    - cron: '0 18 * * *'

permissions:
  contents: read
  security-events: write

jobs:
  secret-and-fs-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Filesystem vulnerability scan advisory
        run: |
          echo "::notice title=Filesystem vulnerability scan advisory::Trivy GitHub Action execution is disabled in this workflow until the action ref is repinned to an available, reviewed release. Dependency scanning remains covered by OSV, Semgrep, and pnpm audit."

  dependency-and-code-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: lumira-ui/pnpm-lock.yaml
      - name: Install frontend dependencies
        working-directory: lumira-ui
        run: pnpm install --frozen-lockfile
      - name: Frontend production audit
        working-directory: lumira-ui
        continue-on-error: true
        run: |
          set +e
          pnpm audit --prod --json > ../security-risk-acceptance-pnpm-audit.json
          status=$?
          set -e
          echo "pnpm audit exit status: ${status}"
          exit 0
      - name: OSV scanner
        uses: google/osv-scanner-action/osv-scanner-action@v2.0.3
        continue-on-error: true
        with:
          scan-args: |-
            --format=json
            --output=security-risk-acceptance-osv.json
            --recursive
            .
      - name: Semgrep Java and TypeScript rules
        uses: semgrep/semgrep-action@v1
        continue-on-error: true
        with:
          config: >-
            p/java
            p/typescript
            p/secrets
      - name: Upload dependency risk acceptance reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-risk-acceptance
          path: |
            security-risk-acceptance-*.json
