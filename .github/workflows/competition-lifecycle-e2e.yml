name: Competition Lifecycle E2E

on:
  workflow_dispatch:
  schedule:
    - cron: '30 18 * * 1'

concurrency:
  group: competition-lifecycle-e2e
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  lifecycle:
    name: Local Full Lifecycle
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0

      - name: Prepare isolated Docker network
        run: docker network inspect 1panel-network >/dev/null 2>&1 || docker network create 1panel-network

      - name: Create ephemeral local-only credentials
        shell: bash
        run: |
          node <<'NODE'
          const crypto = require('node:crypto');
          const fs = require('node:fs');
          const path = require('node:path');

          const secret = (label) => `${label}!${crypto.randomBytes(24).toString('base64url')}9a`;
          const adminInitial = secret('AdminInitial');
          const resolvedPassword = secret('LifecycleResolved');
          const participantInitial = secret('ParticipantInitial');
          const expertInitial = secret('ExpertInitial');
          const bootstrapFile = path.join(process.env.RUNNER_TEMP, 'lumira-bootstrap-admin-password');
          fs.writeFileSync(bootstrapFile, adminInitial, { mode: 0o600 });
          for (const value of [adminInitial, resolvedPassword, participantInitial, expertInitial]) {
            process.stdout.write(`::add-mask::${value}\n`);
          }
          fs.appendFileSync(process.env.GITHUB_ENV, [
            `LUMIRA_BOOTSTRAP_ADMIN_PASSWORD_FILE=${bootstrapFile}`,
            `LIFECYCLE_ADMIN_INITIAL_PASSWORD=${adminInitial}`,
            `LIFECYCLE_PARTICIPANT_INITIAL_PASSWORD=${participantInitial}`,
            `LIFECYCLE_EXPERT_INITIAL_PASSWORD=${expertInitial}`,
            `LIFECYCLE_PASSWORD=${resolvedPassword}`,
            'LIFECYCLE_BASE_URL=http://127.0.0.1:8000',
            'LIFECYCLE_SMTP_SINK_URL=http://127.0.0.1:2526',
            'LIFECYCLE_SMTP_SERVER_HOST=host.docker.internal',
            'LIFECYCLE_SMTP_SERVER_PORT=2525',
            `LIFECYCLE_SUMMARY_FILE=${path.join(process.env.RUNNER_TEMP, 'competition-lifecycle-summary.json')}`,
            'PLAYWRIGHT_ADMIN_USER=admin',
            `PLAYWRIGHT_ADMIN_PASSWORD=${resolvedPassword}`,
            `PLAYWRIGHT_NEW_PASSWORD=${resolvedPassword}`,
            'PLAYWRIGHT_PARTICIPANT_USER=e2e_lifecycle_participant',
            `PLAYWRIGHT_PARTICIPANT_PASSWORD=${resolvedPassword}`,
            'PLAYWRIGHT_EXPERT_USER=e2e_lifecycle_expert',
            `PLAYWRIGHT_EXPERT_PASSWORD=${resolvedPassword}`,
            'PLAYWRIGHT_ROLE_MATRIX=true',
            'PLAYWRIGHT_BASE_URL=http://127.0.0.1:8001',
          ].join('\n') + '\n');
          NODE

      - name: Rebuild an isolated local platform
        env:
          BACKUP_ROOT: ${{ runner.temp }}/lumira-backups
          PLAYWRIGHT_ALLOW_DB_RESET: 'true'
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:8000
          DEPLOY_CHECK_BASE_URL: http://127.0.0.1:8000
        run: node bin/reset-e2e-platform.mjs

      - name: Start isolated browser frontend
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:8001
          DEPLOY_CHECK_BASE_URL: http://127.0.0.1:8000
        run: |
          node bin/deploy-container.mjs --rebuild --local-mysql --services lumira-ui --skip-migrations
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:8001/user/login >/dev/null; then
              exit 0
            fi
            sleep 0.25
          done
          docker logs --tail 200 lumira-ui
          exit 1

      - name: Start isolated SMTP capture
        shell: bash
        env:
          SMTP_SINK_HOST: 0.0.0.0
          SMTP_SINK_PORT: '2525'
          SMTP_SINK_HTTP_HOST: 127.0.0.1
          SMTP_SINK_HTTP_PORT: '2526'
        run: |
          node bin/lib/smtp-sink.mjs > "${RUNNER_TEMP}/lumira-smtp-sink.log" 2>&1 &
          echo "SMTP_SINK_PID=$!" >> "$GITHUB_ENV"
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:2526/health >/dev/null; then
              exit 0
            fi
            sleep 0.25
          done
          cat "${RUNNER_TEMP}/lumira-smtp-sink.log"
          exit 1

      - name: Run competition lifecycle fixture and E2E
        run: npm run test:competition-lifecycle

      - name: Print lifecycle runtime diagnostics
        if: failure()
        shell: bash
        run: |
          for container in lumira-ui lumira-api-proxy lumira-async lumira-server-blue; do
            echo "::group::${container} recent logs"
            docker logs --since 10m --tail 500 "${container}" 2>&1 || true
            echo "::endgroup::"
          done

      - name: Install browser quality dependencies
        working-directory: lumira-ui
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium

      - name: Run role, 390px, and accessibility gates
        working-directory: lumira-ui
        run: pnpm exec playwright test --project=role-access --project=quality --project=mobile-390

      - name: Print lifecycle summary
        if: always()
        shell: bash
        run: |
          if [[ -f "${LIFECYCLE_SUMMARY_FILE}" ]]; then
            cat "${LIFECYCLE_SUMMARY_FILE}"
          fi

      - name: Stop SMTP capture
        if: always()
        shell: bash
        run: |
          if [[ -n "${SMTP_SINK_PID:-}" ]]; then
            kill "${SMTP_SINK_PID}" 2>/dev/null || true
          fi
