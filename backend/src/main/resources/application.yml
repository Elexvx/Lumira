spring:
  application:
    name: saas-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/saas_foundation?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
  flyway:
    enabled: true
    locations: classpath:db/migration

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

saas:
  security:
    jwt-secret: ${JWT_SECRET:saas_foundation_jwt_secret_for_dev_env_please_change_me_2026}
    issuer: saas-foundation
    access-token-expire-seconds: ${ACCESS_TOKEN_EXPIRE_SECONDS:1800}
    refresh-token-expire-seconds: ${REFRESH_TOKEN_EXPIRE_SECONDS:604800}
    permit-paths:
      - /api/v1/auth/login
      - /api/v1/auth/refresh-token
      - /actuator/health
      - /api/health
      - /swagger-ui.html
      - /swagger-ui/**
      - /api-docs/**
  tenant:
    header-name: X-Tenant-Id

logging:
  config: classpath:logback-spring.xml
