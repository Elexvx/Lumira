spring:
  application:
    name: saas-backend
  servlet:
    multipart:
      max-file-size: ${UPLOAD_MAX_FILE_SIZE:5MB}
      max-request-size: ${UPLOAD_MAX_REQUEST_SIZE:5MB}
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/saas?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    placeholders:
      defaultAdminInitEnabled: false
      defaultAdminPasswordHash: ${DEFAULT_ADMIN_PASSWORD_HASH:$2a$10$ko3RP4YpfVgyQC5pZjq5t.d1TKrqmBGoehczMjqn1k.pLeAAnTI9G}

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

saas:
  web:
    cors-allowed-origin-patterns:
      - http://localhost:*
      - http://127.0.0.1:*
    trust-forwarded-headers: ${TRUST_FORWARDED_HEADERS:false}
    trusted-proxy-cidrs:
      - 127.0.0.1/32
      - ::1/128
  security:
    jwt-secret: ${JWT_SECRET:saas_foundation_jwt_secret_for_dev_env_please_change_me_2026}
    issuer: saas-foundation
    idle-timeout-seconds: ${IDLE_TIMEOUT_SECONDS:1800}
    access-token-expire-seconds: ${ACCESS_TOKEN_EXPIRE_SECONDS:1800}
    refresh-token-expire-seconds: ${REFRESH_TOKEN_EXPIRE_SECONDS:604800}
    captcha-enabled: ${CAPTCHA_ENABLED:true}
    captcha-type: ${CAPTCHA_TYPE:IMAGE}
    permit-paths:
      - /api/v1/auth/login
      - /api/v1/auth/second-factor/complete
      - /api/v1/auth/refresh-token
      - /api/v1/public/branding-settings
      - /api/v1/public/agreement-settings
      - /api/v1/public/security-settings
      - /api/v1/public/captcha/**
      - /api/uploads/**
      - /actuator/health
      - /api/health
  tenant:
    header-name: X-Tenant-Id
  plugin:
    platform-version: ${PLUGIN_PLATFORM_VERSION:0.1.0}
    api-version: ${PLUGIN_API_VERSION:1.0.0}
    storage-root: ${PLUGIN_STORAGE_ROOT:storage/plugins}
    staging-root: ${PLUGIN_STAGING_ROOT:storage/plugin-staging}
    signature-secret: ${PLUGIN_SIGNATURE_SECRET:saas-plugin-signature-secret-dev-only}
    shared-deps-version: ${PLUGIN_SHARED_DEPS_VERSION:1}
  upload:
    storage-root: ${UPLOAD_STORAGE_ROOT:storage/uploads}
    public-path: /api/uploads
    max-image-size-bytes: ${UPLOAD_MAX_IMAGE_SIZE_BYTES:5242880}

logging:
  config: classpath:logback-spring.xml
