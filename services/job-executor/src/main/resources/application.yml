spring:
  application:
    name: job-executor
  config:
    import:
      - optional:nacos:job-executor.yaml?refreshEnabled=true&group=DEFAULT_GROUP
  cloud:
    nacos:
      config:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        file-extension: yaml
        namespace: ${NACOS_NAMESPACE:}
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        namespace: ${NACOS_NAMESPACE:}
        enabled: ${NACOS_DISCOVERY_ENABLED:false}
    sentinel:
      transport:
        port: ${SENTINEL_TRANSPORT_PORT:8727}

saas:
  job:
    backend-base-url: ${SAAS_JOB_BACKEND_BASE_URL:http://localhost:8080}
    message-service-base-url: ${SAAS_JOB_MESSAGE_SERVICE_BASE_URL:http://localhost:8085}
    payment-service-base-url: ${SAAS_JOB_PAYMENT_SERVICE_BASE_URL:http://localhost:8086}
    internal-token: ${SAAS_JOB_INTERNAL_TOKEN}

xxl:
  job:
    accessToken: ${XXL_JOB_ACCESS_TOKEN:${XXL_JOB_ADMIN_ACCESS_TOKEN}}
    admin:
      addresses: ${XXL_JOB_ADMIN_ADDRESSES:http://localhost:8090/xxl-job-admin}
      timeout: ${XXL_JOB_ADMIN_TIMEOUT:3}
    executor:
      enabled: ${XXL_JOB_EXECUTOR_ENABLED:true}
      appname: ${XXL_JOB_EXECUTOR_APPNAME:lumira-job-executor}
      address: ${XXL_JOB_EXECUTOR_ADDRESS:}
      ip: ${XXL_JOB_EXECUTOR_IP:}
      port: ${XXL_JOB_EXECUTOR_PORT:9998}
      logpath: ${XXL_JOB_EXECUTOR_LOG_PATH:storage/xxl-job/logs}
      logretentiondays: ${XXL_JOB_EXECUTOR_LOG_RETENTION_DAYS:30}

server:
  port: ${SERVER_PORT:8089}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,sentinel
  metrics:
    tags:
      application: ${spring.application.name}
      service: ${spring.application.name}
