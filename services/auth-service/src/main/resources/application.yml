spring:
  application:
    name: auth-service
  config:
    import:
      - optional:nacos:auth-service.yaml?refreshEnabled=true&group=DEFAULT_GROUP
  cloud:
    nacos:
      config:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        file-extension: yaml
        namespace: ${NACOS_NAMESPACE:}
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        namespace: ${NACOS_NAMESPACE:}
        enabled: ${NACOS_DISCOVERY_ENABLED:false}
    sentinel:
      transport:
        port: ${SENTINEL_TRANSPORT_PORT:8720}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}

server:
  port: ${SERVER_PORT:8082}

management:
  endpoints:
    web:
      exposure:
        include: health,info,sentinel

saas:
  job:
    internal-token: ${SAAS_JOB_INTERNAL_TOKEN:}
  security:
    jwt-secret: ${JWT_SECRET}
    issuer: saas-auth
    idle-timeout-seconds: ${IDLE_TIMEOUT_SECONDS:1800}
    access-token-expire-seconds: ${ACCESS_TOKEN_EXPIRE_SECONDS:1800}
    refresh-token-expire-seconds: ${REFRESH_TOKEN_EXPIRE_SECONDS:604800}
    captcha-enabled: ${CAPTCHA_ENABLED:true}
    permit-paths:
      - /api/v1/auth/login
      - /api/v1/auth/login-encryption-key
      - /api/v1/auth/login/code/challenge
      - /api/v1/auth/login/code/complete
      - /api/v1/auth/second-factor/complete
      - /api/v1/auth/refresh-token
      - /api/v1/auth/logout
      - /api/v1/auth/current-user
      - /actuator/health
