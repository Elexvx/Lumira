spring:
  application:
    name: plugin-service
  config:
    import:
      - optional:nacos:plugin-service.yaml?refreshEnabled=true&group=DEFAULT_GROUP
  servlet:
    multipart:
      max-file-size: ${UPLOAD_MAX_FILE_SIZE:200MB}
      max-request-size: ${UPLOAD_MAX_REQUEST_SIZE:200MB}
  cloud:
    nacos:
      config:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        file-extension: yaml
        namespace: ${NACOS_NAMESPACE:}
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        namespace: ${NACOS_NAMESPACE:}
        enabled: ${NACOS_DISCOVERY_ENABLED:false}
    sentinel:
      transport:
        port: ${SENTINEL_TRANSPORT_PORT:8724}
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/saas?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: false
    locations: classpath:db/migration
    ignore-migration-patterns:
      - "*:missing"

server:
  port: ${SERVER_PORT:8086}

management:
  endpoints:
    web:
      exposure:
        include: health,info,sentinel

saas:
  security:
    jwt-secret: ${JWT_SECRET:saas_foundation_jwt_secret_for_dev_env_please_change_me_2026}
    permit-paths:
      - /actuator/health
  plugin:
    platform-version: ${PLUGIN_PLATFORM_VERSION:0.1.0}
    api-version: ${PLUGIN_API_VERSION:1.0.0}
    storage-root: ${PLUGIN_STORAGE_ROOT:storage/plugins}
    staging-root: ${PLUGIN_STAGING_ROOT:storage/plugin-staging}
    signature-secret: ${PLUGIN_SIGNATURE_SECRET:change-me-plugin-signature-secret}
    shared-deps-version: ${PLUGIN_SHARED_DEPS_VERSION:1}
