spring:
  application:
    name: plugin-service
  config:
    import:
      - optional:nacos:plugin-service.yaml?refreshEnabled=true&group=DEFAULT_GROUP
  servlet:
    multipart:
      max-file-size: ${UPLOAD_MAX_FILE_SIZE:200MB}
      max-request-size: ${UPLOAD_MAX_REQUEST_SIZE:200MB}
  cloud:
    discovery:
      client:
        simple:
          instances:
            auth-service:
              - uri: ${AUTH_SERVICE_BASE_URL:http://localhost:8082}
            system-service:
              - uri: ${SYSTEM_SERVICE_BASE_URL:http://localhost:8080}
    nacos:
      config:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        file-extension: yaml
        namespace: ${NACOS_NAMESPACE:}
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        namespace: ${NACOS_NAMESPACE:}
        enabled: ${NACOS_DISCOVERY_ENABLED:false}
    sentinel:
      transport:
        port: ${SENTINEL_TRANSPORT_PORT:8724}
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/saas?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: false
    locations: classpath:db/migration
    ignore-migration-patterns:
      - "*:missing"

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

server:
  port: ${SERVER_PORT:8086}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,sentinel
  metrics:
    tags:
      application: ${spring.application.name}
      service: ${spring.application.name}

saas:
  security:
    jwt-secret: ${JWT_SECRET}
    permit-paths:
      - /api/version
      - /api/v1/version
      - /api/v1/*/version
      - /actuator/health
      - /actuator/info
      - /actuator/prometheus
  plugin:
    platform-version: ${PLUGIN_PLATFORM_VERSION:0.1.0}
    api-version: ${PLUGIN_API_VERSION:1.0.0}
    storage-root: ${PLUGIN_STORAGE_ROOT:storage/plugins}
    staging-root: ${PLUGIN_STAGING_ROOT:storage/plugin-staging}
    signature-secret: ${PLUGIN_SIGNATURE_SECRET}
    shared-deps-version: ${PLUGIN_SHARED_DEPS_VERSION:1}
    max-gateway-body-bytes: ${PLUGIN_MAX_GATEWAY_BODY_BYTES:1048576}
    require-http-permission: ${PLUGIN_REQUIRE_HTTP_PERMISSION:true}
