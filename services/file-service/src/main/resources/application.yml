spring:
  application:
    name: file-service
  config:
    import:
      - optional:nacos:file-service.yaml?refreshEnabled=true&group=DEFAULT_GROUP
  servlet:
    multipart:
      max-file-size: ${UPLOAD_MAX_FILE_SIZE:50MB}
      max-request-size: ${UPLOAD_MAX_REQUEST_SIZE:50MB}
  cloud:
    discovery:
      client:
        simple:
          instances:
            auth-service:
              - uri: ${AUTH_SERVICE_BASE_URL:http://localhost:8082}
    nacos:
      config:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        file-extension: yaml
        namespace: ${NACOS_NAMESPACE:}
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        namespace: ${NACOS_NAMESPACE:}
        enabled: ${NACOS_DISCOVERY_ENABLED:false}
    sentinel:
      transport:
        port: ${SENTINEL_TRANSPORT_PORT:8722}
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/saas?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
  flyway:
    enabled: true
    validate-on-migrate: false
    baseline-on-migrate: true
    locations: classpath:db/migration
    ignore-migration-patterns:
      - "*:missing"

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

server:
  port: ${SERVER_PORT:8084}

management:
  endpoints:
    web:
      exposure:
        include: health,info,sentinel

saas:
  web:
    cors-allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*}
  job:
    internal-token: ${SAAS_JOB_INTERNAL_TOKEN}
  security:
    jwt-secret: ${JWT_SECRET}
    permit-paths:
      - /api/uploads/**
      - /actuator/health
      - /error
  upload:
    storage-root: ${UPLOAD_STORAGE_ROOT:storage/uploads}
    public-path: /api/uploads
    max-image-size-bytes: ${UPLOAD_MAX_IMAGE_SIZE_BYTES:5242880}
    max-document-size-bytes: ${UPLOAD_MAX_DOCUMENT_SIZE_BYTES:52428800}
