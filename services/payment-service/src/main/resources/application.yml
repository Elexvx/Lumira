spring:
  application:
    name: payment-service
  config:
    import:
      - optional:nacos:payment-service.yaml?refreshEnabled=true&group=DEFAULT_GROUP
  cloud:
    discovery:
      client:
        simple:
          instances:
            auth-service:
              - uri: ${AUTH_SERVICE_BASE_URL:http://localhost:8082}
    nacos:
      config:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        file-extension: yaml
        namespace: ${NACOS_NAMESPACE:}
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        namespace: ${NACOS_NAMESPACE:}
        enabled: ${NACOS_DISCOVERY_ENABLED:false}
    sentinel:
      transport:
        port: ${SENTINEL_TRANSPORT_PORT:8730}
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/saas_payment?useUnicode=true&characterEncoding=utf8&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:2}
  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: false
    locations:
      - classpath:db/migration/payment
    ignore-migration-patterns:
      - "*:missing"

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

server:
  port: ${SERVER_PORT:8086}

saas:
  web:
    cors-allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*}
    trust-forwarded-headers: ${TRUST_FORWARDED_HEADERS:false}
    trusted-proxy-cidrs:
      - 127.0.0.1/32
      - ::1/128
  security:
    jwt-secret: ${JWT_SECRET}
    field-secret: ${FIELD_SECRET}
    issuer: saas-payment
    permit-paths:
      - /api/v1/payment/webhooks/**
      - /api/version
      - /api/v1/version
      - /api/v1/*/version
      - /actuator/health
      - /actuator/info
      - /actuator/prometheus
      - /api/health
  payment:
    public-base-url: ${PAYMENT_PUBLIC_BASE_URL:http://localhost:8086}
    auth-service-base-url: ${AUTH_SERVICE_BASE_URL:http://localhost:8082}
  event:
    outbox:
      relay-enabled: ${SAAS_EVENT_OUTBOX_RELAY_ENABLED:false}
      batch-size: ${SAAS_EVENT_OUTBOX_BATCH_SIZE:100}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
      service: ${spring.application.name}
